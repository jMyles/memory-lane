<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>magenta</title>
<link rel="manifest" href="/motions/manifest.webmanifest">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#b8106b" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1f1c20" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" sizes="192x192" href="/motions/icon-192.png">
<link rel="apple-touch-icon" href="/motions/icon-180.png">
<style>
  :root {
    --bg: #fbfaf7; --panel: #ffffff; --ink: #1f1d1a; --muted: #6b6560;
    --line: #e6e1d8; --accent: #b8106b; --accent-soft: #fbe7f1;
    --human: #2a5d9f; --agent: #b8106b; --code: #f3efe8; --mention: #fff3c4;
    --hover: #f6f3ee; --warn-ink: #7a4b00; --warn-bg: #ffe9b0; --dot-edge: #d6cfc2; --err: #b3261e;
  }
  /* Dark, when the system is: the same tokens, night colours. */
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161417; --panel: #1f1c20; --ink: #ece7e1; --muted: #a39b93;
      --line: #36313a; --accent: #ef5aa6; --accent-soft: #3a1a2b;
      --human: #86b4f0; --agent: #ef5aa6; --code: #29252c; --mention: #4a3f12;
      --hover: #262228; --warn-ink: #ffd27a; --warn-bg: #3b2c08; --dot-edge: #4d4652; --err: #ff8a80;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 15px; line-height: 1.5; color: var(--ink); background: var(--bg);
    display: flex; flex-direction: column;
  }
  /* One slim line: where you are, the servers, search, and you. */
  header {
    display: flex; align-items: center; gap: 10px; padding: 5px 14px; min-height: 38px;
    border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: nowrap; position: relative;
  }
  header .brand { font-weight: 700; color: var(--accent); letter-spacing: .02em; text-decoration: none; white-space: nowrap; }
  header .crumb { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  header .crumb::before { content: '› '; color: var(--muted); font-weight: 400; }
  header .crumb:empty { display: none; }
  header .crumb #rename { margin-left: 4px; border: 0; background: none; color: var(--muted); font-size: 14px; cursor: pointer; padding: 0 2px; }
  header .crumb #rename:hover { color: var(--accent); }
  header .grow { flex: 1; }
  header select { font: inherit; font-size: 13px; padding: 2px 6px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); color: var(--ink); }
  header .status { font-size: 0; }
  header .status::before { content: "●"; font-size: 11px; color: var(--muted); }
  header .status.live::before { color: #2e9e5b; }
  header .status.stale::before { color: #d08b00; }
  header .account { position: relative; }
  #userBtn { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 14px; padding: 1px 10px;
             font: inherit; font-size: 13px; cursor: pointer; white-space: nowrap; }
  #userBtn:hover { border-color: var(--accent); }
  #userMenu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 30; min-width: 220px; background: var(--panel);
              border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 6px 20px rgba(0,0,0,.14); padding: 6px 0;
              display: flex; flex-direction: column; font-size: 13px; }
  #userMenu[hidden] { display: none; }
  #userMenu > * { padding: 6px 14px; color: var(--ink); text-decoration: none; text-align: left; }
  #userMenu > a:hover, #userMenu > button:hover { background: var(--hover); }
  #userMenu .auth { color: var(--muted); border-bottom: 1px solid var(--line); margin-bottom: 4px; }
  #userMenu label { display: flex; align-items: center; gap: 6px; color: var(--muted); cursor: pointer; }
  #userMenu label.only { display: none; }
  body.has-me #userMenu label.only { display: flex; }
  body.writer #userMenu label.me { display: none; }
  #userMenu #notify { border: 0; background: none; font: inherit; cursor: pointer; }
  /* The servers: four dots, pulsing while one is being redeployed. */
  .servers { display: inline-flex; gap: 5px; align-items: center; cursor: pointer; }
  .servers .srv { width: 9px; height: 9px; border-radius: 50%; background: var(--line); }
  .servers .srv.up { background: #2e9e5b; }
  .servers .srv.down { background: #d13b30; }
  .servers .srv.deploying { background: #d08b00; animation: pulse 1s ease-in-out infinite; }
  #serverPop { position: absolute; z-index: 30; top: calc(100% + 6px); right: 120px; min-width: 260px; background: var(--panel);
               border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 6px 20px rgba(0,0,0,.14); padding: 8px 12px; font-size: 13px; }
  #serverPop[hidden] { display: none; }
  #serverPop div { padding: 3px 0; }
  #serverPop .note { color: var(--muted); font-size: 12px; }
  #devicesBox { position: fixed; z-index: 30; top: 44px; right: 12px; width: min(460px, 94vw); max-height: 75vh; overflow-y: auto;
                background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 26px rgba(0,0,0,.18);
                padding: 10px 14px; font-size: 13px; }
  #devicesBox[hidden] { display: none; }
  #devicesBox .head { display: flex; justify-content: space-between; margin-bottom: 6px; }
  #devicesBox .dev { border-top: 1px solid var(--line); padding: 7px 0; }
  #devicesBox .dev .meta { color: var(--muted); font-size: 12px; }
  #devicesBox .dev.revoked, #devicesBox .dev.timed { opacity: .65; }
  #devicesBox button { font: inherit; font-size: 12px; border: 1px solid var(--line); border-radius: 5px; background: var(--panel);
                       color: var(--ink); cursor: pointer; }
  #renameBox, #newBox { position: fixed; z-index: 30; top: 44px; left: 50%; transform: translateX(-50%); width: min(520px, 94vw);
               background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 26px rgba(0,0,0,.18);
               padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  #renameBox[hidden], #newBox[hidden] { display: none; }
  #renameBox .archive { float: right; color: var(--muted); }
  #newBox .hint { font-size: 12.5px; color: var(--muted); }
  #renameBox input, #renameBox textarea, #newBox input, #newBox textarea { font: inherit; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px;
                                          background: var(--bg); color: var(--ink); }
  #renameBox input, #newBox input { font-size: 17px; font-weight: 600; }

  .layout { flex: 1; display: flex; min-height: 0; }

  nav {
    width: var(--nav-width, 190px); flex: none; overflow-y: auto; background: var(--panel);
    border-right: 1px solid var(--line); padding: 10px 0;
  }
  nav .label { padding: 4px 16px 8px; font-size: 11px; text-transform: uppercase;
    letter-spacing: .08em; color: var(--muted); display: flex; align-items: center; }
  nav .label #newMood { margin-left: auto; font: inherit; font-size: 15px; line-height: 1; border: 0; background: none;
                        color: var(--muted); cursor: pointer; padding: 0 2px; }
  nav .label #newMood:hover { color: var(--accent); }
  /* Archived Moods: folded under the list, still readable. */
  nav #archived { margin-top: 8px; }
  nav #archived summary { padding: 4px 16px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
                          color: var(--muted); cursor: pointer; }
  nav #archived a.motion { opacity: .75; }
  nav a.motion {
    display: block; padding: 5px 14px; text-decoration: none; color: inherit;
    border-left: 3px solid transparent;
  }
  nav a.motion:hover { background: var(--hover); }
  nav a.motion.active { background: var(--accent-soft); border-left-color: var(--accent); }
  nav a.motion .title { font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 8px; line-height: 1.3; }
  nav a.motion .meta { font-size: 11.5px; color: var(--muted); line-height: 1.3; }
  nav a.motion .people-line:empty { display: none; }
  header .block { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; cursor: default; }
  /* Someone typing or an agent at work: their name pulses where the Motion is listed. */
  /* What's been happening everywhere, under the list; folds away. */
  #recent, #work { border-top: 1px solid var(--line); margin-top: 8px; padding: 6px 0 12px; font-size: 12.5px; }
  #work .ev .repo { color: var(--muted); }
  #work .older summary { padding: 4px 16px; font-size: 11.5px; color: var(--muted); cursor: pointer; text-transform: none; letter-spacing: 0; }
  #work .older summary::before { content: ''; }
  #recent summary, #work > summary { padding: 4px 16px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
                    color: var(--muted); cursor: pointer; list-style: none; }
  #recent summary::before, #work > summary::before { content: '▸ '; }
  #recent[open] summary::before, #work[open] > summary::before { content: '▾ '; }
  #recent .ev, #work .ev { display: block; padding: 4px 16px; color: var(--muted); text-decoration: none; line-height: 1.35; }
  #recent .ev:hover, #work .ev:hover { background: var(--hover); }
  #recent .ev b, #work .ev b { color: var(--ink); font-weight: 600; }
  #recent .ev .txt, #work .ev .txt { display: block; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #recent .ev time, #work .ev time { float: right; margin-left: 6px; }
  #work .ev .mood { color: var(--accent); cursor: pointer; }
  nav .nm.live { color: var(--ink); font-weight: 600; animation: pulse 1.2s ease-in-out infinite; }
  /* Drag the pane's edge to size it; the width is remembered in this browser. */
  #grip { width: 5px; margin-left: -3px; flex: none; cursor: col-resize; position: relative; z-index: 1; }
  #grip:hover, body.sizing #grip { background: var(--accent-soft); }
  body.sizing { cursor: col-resize; user-select: none; }
  .badge {
    display: inline-block; min-width: 18px; padding: 0 6px; border-radius: 9px;
    background: var(--accent); color: #fff; font-size: 11px; font-weight: 700;
    line-height: 18px; text-align: center;
  }

  main { flex: 1; min-width: 0; overflow-y: auto; padding: 22px 0 0; container-type: inline-size; }  /* no bottom padding: it would hold the sticky footer off the bottom */
  /* --gutter: what the jump strip takes at the right (25px + margins). When the
     window leaves room beside the column the text never reaches it; when the
     column fills the width (a phone, zoomed in), its text stops short of it. */
  .inner { --gutter: 36px; max-width: 760px; margin: 0 auto;
           padding: 0 max(22px, calc(var(--gutter) - max(0px, (100cqw - 760px) / 2))) 0 22px; }

  .motion-head h1 { font-size: 22px; margin: 0 0 4px; }
  .motion-head .desc { color: var(--muted); margin: 0 0 6px; }
  .motion-head .meta { font-size: 12px; color: var(--muted); }
  .motion-head .meta a { color: var(--muted); }
  .motion-head { padding-bottom: 14px; border-bottom: 1px solid var(--line); margin-bottom: 8px; }

  .turn { padding: 12px 0 12px 10px; margin-left: -10px; border-top: 1px solid var(--line); border-left: 3px solid transparent; }
  #turns > .turn:first-child { border-top: 0; }
  /* The same sender again within minutes: one heading for the run. */
  .turn.cont { border-top: 0; padding-top: 0; }
  .turn.cont .who { display: none; }
  .turn.mentions-me { border-left-color: var(--accent); }
  body.only-mine .turn:not(.mentions-me) { display: none; }
  .turn .who { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
  .turn .who .name { font-weight: 700; }
  .turn.human .who .name { color: var(--human); }
  .turn.agent .who .name { color: var(--agent); }
  .turn .who time { font-size: 12px; color: var(--muted); }
  .turn .who .how, .work .who .how { font-size: 11px; color: var(--muted); background: var(--code); border-radius: 8px; padding: 0 7px; }
  .turn .body > :first-child { margin-top: 0; }
  .turn .body > :last-child { margin-bottom: 0; }
  .turn .body p { margin: 0 0 .7em; }
  .turn .body ul, .turn .body ol { margin: 0 0 .7em; padding-left: 1.4em; }
  .turn .body h4 { margin: .8em 0 .3em; font-size: 15px; }
  .turn .body code { background: var(--code); padding: 1px 5px; border-radius: 4px; font-size: 13px; }
  .turn .body pre { background: var(--code); padding: 10px 12px; border-radius: 6px; overflow-x: auto; font-size: 13px; }
  .turn .body pre code { background: none; padding: 0; }
  .turn .body table { border-collapse: collapse; margin: .4em 0 .8em; font-size: 14px; }
  .turn .body th, .turn .body td { border: 1px solid var(--line); padding: 4px 10px; text-align: left; vertical-align: top; }
  .turn .body th { background: var(--code); font-weight: 600; }
  .turn .body a { color: var(--human); }
  .turn .body a.wikilink { color: var(--accent); text-decoration: underline dotted; }
  .mention { background: var(--code); border-radius: 4px; padding: 0 4px; font-weight: 600; }
  .mention.me { background: var(--mention); }
  .turn.new { animation: arrive .6s ease-out; }
  @keyframes arrive { from { background: var(--accent-soft); } to { background: transparent; } }

  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
  header .auth { font-size: 13px; color: var(--muted); }
  header .preview { font-size: 12px; font-weight: 600; color: var(--warn-ink); background: var(--warn-bg); border-radius: 4px; padding: 1px 8px; }
  header .auth a { color: var(--muted); }
  #footer { position: sticky; bottom: 0; background: var(--bg); border-top: 1px solid var(--line); }
  /* Up and down a message at a time, at the right of the thread. */
  /* Two pairs: every message (right), people's messages only (left, with a person on them). */
  /* Tight little tabs in the right margin; the thread keeps a gutter clear of them (main, below). */
  #jump { --jw: 25px; --jh: 19px; position: absolute; right: 4px; bottom: calc(100% + 6px); display: grid;
          grid-template-columns: auto; gap: 2px; }
  /* One strip, symmetric: for you, people, every message -- up above, down below. */
  #jumpMeUp { order: 1; } #jumpHumanUp { order: 2; } #jumpUp { order: 3; }
  #jumpDown { order: 4; } #jumpHumanDown { order: 5; } #jumpMeDown { order: 6; }
  #jump button { width: var(--jw); height: var(--jh); border-radius: 3px; border: 1px solid var(--line); background: var(--panel);
                 color: var(--muted); font-size: 12px; line-height: 1; cursor: pointer; opacity: .85;
                 display: inline-flex; align-items: center; justify-content: center; padding: 0; }
  #jump button:hover { opacity: 1; }
  #jump button.human { color: var(--human); font-size: 11px; gap: 0; }
  /* A third pair, for what's for you (mentions of you, answers to you), once you're someone. */
  #jump button.forme { display: none; color: var(--accent); font-size: 10.5px; letter-spacing: -.5px; }
  body.has-me #jump button.forme { display: inline-flex; }
  #toBottom { display: none; position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(100% + 12px);
              border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 16px;
              padding: 4px 12px; font: inherit; font-size: 13px; cursor: pointer; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  #toBottom.on { display: block; }
  #toBottom:hover { color: var(--accent); border-color: var(--accent); }
  .turn.for-me { border-left-color: var(--accent); }
  .turn.flash { animation: flash 2.4s ease-out; }
  @keyframes flash { from { background: var(--mention); } to { background: transparent; } }
  /* Search: a panel over the thread, at the right. */
  #searchBtn { border: 1px solid var(--line); background: var(--panel); color: var(--muted); border-radius: 14px;
               padding: 1px 10px; font: inherit; font-size: 13px; cursor: pointer; }
  #searchBtn:hover { color: var(--accent); border-color: var(--accent); }
  #search { position: fixed; top: 41px; right: 0; bottom: 0; width: min(440px, 100vw); background: var(--panel);
            border-left: 1px solid var(--line); box-shadow: -4px 0 18px rgba(0,0,0,.12); z-index: 20;
            display: flex; flex-direction: column; }
  #search[hidden] { display: none; }
  #search .bar { display: flex; gap: 6px; padding: 10px; border-bottom: 1px solid var(--line); }
  #search input { flex: 1; min-width: 0; font: inherit; padding: 6px 9px; border: 1px solid var(--line); border-radius: 6px;
                  background: var(--bg); color: var(--ink); }
  #search select, #search button { font: inherit; font-size: 13px; border: 1px solid var(--line); border-radius: 6px;
                                   background: var(--panel); color: var(--ink); }
  #search button { cursor: pointer; padding: 0 9px; }
  #qresults { overflow-y: auto; flex: 1; }
  #qresults .hit { display: block; padding: 8px 12px; border-bottom: 1px solid var(--line); color: var(--muted);
                   text-decoration: none; font-size: 12.5px; }
  #qresults .hit:hover { background: var(--hover); }
  #qresults .hit b { color: var(--ink); }
  #qresults .hit .txt { display: block; color: var(--ink); font-size: 13.5px; margin-top: 2px; }
  #qresults mark { background: var(--mention); color: inherit; border-radius: 2px; }
  #qresults .note { padding: 12px; color: var(--muted); font-size: 13px; }
  #notify { border: 0; background: none; cursor: pointer; font-size: 15px; padding: 0 2px; color: var(--muted); }
  #notify[hidden] { display: none; }
  #jump button.human svg { width: 9px; height: 9px; }
  #jump button:hover { color: var(--accent); border-color: var(--accent); }
  /* Where a session's context was compacted: one line, its summary on demand. */
  /* Something that happened around the conversation: a server redeployed. */
  a.permalink { color: inherit; text-decoration: none; }
  a.permalink:hover time { text-decoration: underline; }
  a.permalink[data-copied]::after { content: ' link copied'; color: var(--accent); font-size: 11px; }
  /* An agent's turn: everything it did between a person's words and its last, under one header. */
  .aturn { margin: 4px 0 4px -10px; border-left: 3px solid transparent; }
  .aturn:hover { border-left-color: var(--line); }
  .ahead { display: flex; gap: 6px; align-items: baseline; width: 100%; text-align: left; border: 0; background: none;
           padding: 6px 10px 2px; font: inherit; font-size: 12.5px; color: var(--muted); cursor: pointer; }
  .ahead b { color: var(--agent); font-weight: 600; }
  .ahead .caret { width: 10px; flex: none; }
  .ahead .preview { display: none; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
                    color: var(--ink); font-size: 13.5px; }
  .aturn.folded .ahead .preview { display: block; }
  .aturn.folded .abody { display: none; }
  .abody { padding-left: 10px; }
  /* A statement signed with someone's SSH key. */
  .signed { font-size: 11.5px; color: #2e9e5b; border: 1px solid currentColor; border-radius: 10px; padding: 0 7px;
            cursor: pointer; background: none; font-family: inherit; }
  .proof { font-size: 12px; background: var(--code); border-radius: 6px; padding: 8px 10px; margin-top: 6px; }
  .proof pre { white-space: pre-wrap; word-break: break-all; margin: 4px 0; font-size: 11px; }
  .event { margin: 8px 0; font-size: 12.5px; color: var(--muted); text-align: center; }
  .event.failed { color: var(--err); }
  .event code { font-size: 11.5px; }
  .compaction { margin: 10px 0; font-size: 13px; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 8px; }
  .compaction summary { cursor: pointer; list-style: none; }
  .compaction summary::before { content: '⟲ '; }
  .compaction[open] summary { margin-bottom: 6px; }
  .compaction .body { font-size: 13px; color: var(--ink); background: var(--code); border-radius: 6px; padding: 8px 12px;
                      max-height: 60vh; overflow-y: auto; }
  #activity, #composer { max-width: 760px; margin: 0 auto; }  /* the reading column's width */
  #composer { display: none; position: relative; padding: 10px 16px 14px; }
  body.writer #composer { display: flex; gap: 8px; align-items: flex-end; }
  #composer textarea { flex: 1; font: inherit; min-height: 44px; max-height: 40vh; resize: vertical; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink); }
  #composer button { font: inherit; padding: 8px 14px; border: 0; border-radius: 6px; background: var(--accent); color: #fff; cursor: pointer; }
  #composer button:disabled { opacity: .5; cursor: default; }
  #composer .err { color: var(--accent); font-size: 12px; }
  #activity { display: none; align-items: center; gap: 8px; padding: 8px 16px; font-size: 13px; color: var(--muted); }
  #activity.on { display: flex; }
  #activity .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--agent); animation: pulse 1.2s ease-in-out infinite; }
  #activity b { color: var(--agent); }
  /* Held: owed a turn the runner isn't starting yet -- a still dot, not a pulse. */
  #activity.held .dot { animation: none; opacity: .35; }
  #activity #stopBtn { margin-left: auto; font: inherit; font-size: 12px; padding: 2px 9px; border: 1px solid var(--line);
                       border-radius: 10px; background: var(--panel); color: var(--muted); cursor: pointer; white-space: nowrap; }
  #activity #stopBtn:hover { color: var(--err); border-color: var(--err); }
  @keyframes pulse { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
  .people { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .people .who { font-size: 12px; padding: 1px 8px; border-radius: 10px; background: var(--code); }
  .people .who.human { color: var(--human); }
  .people .who.agent { color: var(--agent); }
  .people .who.busy::after { content: ' ●'; animation: pulse 1.2s ease-in-out infinite; }
  /* Who is a person and who is an agent, wherever a name appears. */
  .ico { width: 13px; height: 13px; fill: currentColor; vertical-align: -1px; margin-right: 4px; flex: none; }
  .people .who.typing::after { content: ' typing…'; color: var(--muted); animation: pulse 1.2s ease-in-out infinite; }
  #tasks { display: none; flex-wrap: wrap; gap: 6px; padding: 6px 16px 0; font-size: 12.5px; color: var(--muted);
           max-width: 760px; margin: 0 auto; }
  #tasks.on { display: flex; }
  #tasks .task { background: var(--code); border-radius: 10px; padding: 1px 9px; }
  #tasks .sum { cursor: pointer; }
  #tasks .sum:hover { color: var(--ink); }
  #tasks .list { display: none; flex-wrap: wrap; gap: 6px; flex-basis: 100%; }
  #tasks.open .list { display: flex; }
  #tasks .task::before { content: '⚙ '; }
  #tasks .task.helper::before { content: '✦ '; }
  #typing { display: none; padding: 6px 16px 0; font-size: 13px; color: var(--muted); }
  #typing.on { display: block; }

  /* An agent's tool calls between its words: one line, opened on demand. */
  .work { margin: 2px 0 6px -10px; padding-left: 13px; }
  .work .who { display: flex; align-items: baseline; gap: 8px; margin: 10px 0 4px; }
  .work .who .name { font-weight: 700; color: var(--agent); }
  .work .who time { font-size: 12px; color: var(--muted); }
  .work.cont .who { display: none; }
  .work-head { font: inherit; font-size: 13px; color: var(--muted); background: none; border: 0; padding: 2px 0;
               cursor: pointer; text-align: left; }
  .work-head:hover { color: var(--ink); }
  .work-head .caret { display: inline-block; width: 1em; transition: transform .15s; }
  .work.open > .work-head .caret { transform: rotate(90deg); }
  .work .steps { display: none; margin: 4px 0 8px; border-left: 2px solid var(--line); padding-left: 10px; }
  .work.open .steps { display: block; }
  .step-head { font: inherit; font-size: 13px; background: none; border: 0; padding: 3px 0; cursor: pointer;
               text-align: left; color: var(--ink); display: flex; gap: 8px; width: 100%; align-items: baseline; }
  .step-head code { font-size: 12px; background: var(--code); padding: 0 5px; border-radius: 4px; color: var(--muted); flex: none; }
  .step-head .sum { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .step.err .step-head code { color: var(--err); }
  .step-detail { display: none; margin: 4px 0 10px; }
  .step.open .step-detail { display: block; }
  .step-detail .label { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 6px 0 2px; }
  .step-detail pre { margin: 0; background: #1e1d1b; color: #ece8e1; padding: 9px 11px; border-radius: 6px;
                     font-size: 12.5px; line-height: 1.45; max-height: 360px; overflow: auto; white-space: pre-wrap;
                     word-break: break-word; }
  .step-detail pre .del { color: #ff9b8f; }
  .step-detail pre .add { color: #9be59b; }
  .step-detail pre .dim { color: #9a948b; }
  .step-detail .err pre { box-shadow: inset 3px 0 0 #e5534b; }
  #earlier { display: block; margin: 6px auto 14px; font: inherit; font-size: 13px; color: var(--muted);
             background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 3px 14px; cursor: pointer; }
  body.only-mine .work { display: none; }
  /* An agent's choices not to speak: small dots, side by side. */
  .quiet { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 4px 0 4px -10px; padding: 4px 13px; }
  .quiet .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--line); border: 1px solid var(--dot-edge);
                cursor: pointer; padding: 0; }
  .quiet .dot:hover, .quiet .dot.on { background: var(--agent); border-color: var(--agent); }
  /* The runner's quick screen let this pass; the agent itself never looked. */
  .quiet .dot.screened { background: transparent; border-style: dashed; }
  .quiet .dot.screened:hover, .quiet .dot.screened.on { background: transparent; border-color: var(--agent); }
  .quiet .why { flex-basis: 100%; font-size: 13px; color: var(--muted); font-style: italic; }
  body.only-mine .quiet { display: none; }
  /* Thinking the harness kept: dim, as a terminal shows it between tool calls. */
  .thought { margin: 2px 0 4px -10px; padding: 0 13px; font-size: 13.5px; font-style: italic; color: var(--muted);
             white-space: pre-wrap; }
  .thought::before { content: '∴ '; font-style: normal; }
  body.only-mine .thought { display: none; }
  /* Images: in turns, as thumbnails on a run of work, inside a step. */
  .turn .body a.img { display: inline-block; margin: 4px 0; }
  .turn .body img { display: block; max-width: 100%; max-height: 420px; border-radius: 6px; border: 1px solid var(--line); }
  .work .thumbs { display: flex; gap: 6px; flex-wrap: wrap; margin: 2px 0 4px; }
  .work .thumbs img, .step-detail .shots img { height: 84px; max-width: 160px; object-fit: cover; border-radius: 4px;
                                                border: 1px solid var(--line); cursor: zoom-in; }
  .step-detail .shots { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  #composer #attach {  /* beats #composer button, the Send style */
    font: inherit; font-size: 18px; line-height: 1; padding: 8px 10px; background: none; color: var(--muted);
            border: 1px solid var(--line); border-radius: 6px; cursor: pointer; }
  #composer #attach:hover { color: var(--ink); }
  /* On a phone, the agents' settings fold behind ⚙ and Send is an arrow: the room goes to the conversation. */
  #composer #agentsBtn { display: none; position: relative; font: inherit; font-size: 17px; line-height: 1; padding: 8px 9px;
                         background: none; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; cursor: pointer; }
  #composer #agentsBtn .pie { position: absolute; top: -3px; right: -3px; margin: 0; }
  #send svg { display: none; width: 18px; height: 18px; vertical-align: middle; }
  #composer.dropping textarea { outline: 2px dashed var(--accent); }
  /* Whether each agent is listening here; a hush for a long deliberation. */
  /* Each agent's listening, model and effort, and its pie: in the footer, always in view. */
  .hush { display: flex; flex-wrap: wrap; gap: 8px; max-width: 760px; margin: 0 auto; padding: 6px 16px 0;
          font-size: 12.5px; color: var(--muted); }
  .hush:empty { display: none; }
  .hush select { font: inherit; font-size: 12.5px; padding: 1px 4px; border: 1px solid var(--line); border-radius: 4px;
                 background: var(--panel); color: var(--ink); }
  .hush .off { color: var(--accent); }
  .hush .ultra { white-space: nowrap; cursor: pointer; }
  .hush .ultra input { vertical-align: -2px; margin: 0 2px 0 0; }
  /* How full an agent's context is: a little pie, its details on hover. */
  /* Its colour says how close to compacting: green to 70%, yellow to 80, orange to 90, red above. */
  .pie { --pc: #2e9e4f; display: inline-block; width: 11px; height: 11px; border-radius: 50%; vertical-align: -1px;
         margin-right: 4px; background: conic-gradient(var(--pc) var(--p), transparent 0);
         box-shadow: inset 0 0 0 1px var(--pc); cursor: help; }
  .pie.warm { --pc: #d4a514; }
  .pie.hot { --pc: #e8761c; }
  .pie.full { --pc: #d63a2f; }
  #locked { display: none; background: #3a0d0d; color: #ffd9d9; padding: 8px 16px; font-size: 13.5px; }
  body.locked #locked { display: block; }
  body.locked #composer, body.locked #typing { display: none !important; }
  header a.settings { font-size: 13px; color: var(--muted); }
  #suggest { display: none; position: absolute; bottom: 100%; left: 16px; margin-bottom: 4px; background: var(--panel);
             border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 4px 14px rgba(0,0,0,.08); min-width: 180px; z-index: 5; }
  #suggest.on { display: block; }
  #suggest div { padding: 5px 10px; cursor: pointer; font-size: 14px; }
  #suggest div.sel, #suggest div:hover { background: var(--accent-soft); }
  #suggest small { color: var(--muted); margin-left: 6px; }
  #suggest .emo { display: inline-block; width: 1.6em; font-size: 16px; }
  #menu { display: none; font: inherit; font-size: 20px; line-height: 1; background: none; border: 0;
          color: var(--muted); cursor: pointer; padding: 0 2px; }
  @media (max-width: 720px) {
    header { flex-wrap: nowrap; gap: 8px; padding: 6px 12px; }
    header .brand small { display: none; }
    header .preview { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; }
    #menu { display: block; }
    header .brand { display: none; }  /* the Mood's name matters more here */
    header .block { display: none; }
    header .crumb::before { content: none; }
    header .preview { max-width: 70px; }
    #serverPop { right: 8px; }
    .layout { flex-direction: column; }
    nav, #grip { display: none; }
    body.menu-open nav { display: block; width: auto; max-height: 40vh; border-right: 0; border-bottom: 1px solid var(--line); }
    main { padding-top: 12px; }
    .inner { padding: 0 max(12px, calc(var(--gutter) - max(0px, (100cqw - 760px) / 2))) 0 12px; }
    .motion-head h1 { font-size: 19px; }
    #activity { padding: 6px 12px; }
    .hush { padding: 4px 12px 0; }
    #jump { right: 3px; }
    #composer { padding: 6px 8px 8px; gap: 6px; }
    #composer textarea { min-height: 38px; padding: 7px 9px; }
    #composer #attach { padding: 8px 9px; }
    #composer #agentsBtn { display: block; }
    #composer #send { padding: 8px 10px; }
    #send .label { display: none; }
    #send svg { display: inline-block; }
    .hush { display: none; }
    body.agents-open .hush:not(:empty) { display: flex; padding: 6px 10px 2px; max-height: 40vh; overflow-y: auto; }
  }
  /* Signed in, you are who you are: no need to choose whose view to see. */
</style>
</head>
<body>
<header>
  <button id="menu" type="button" aria-label="Moods" aria-expanded="false">☰</button>
  <a class="brand" href="/motions/">magenta</a>
  <span class="crumb" id="crumb"></span>
  {% if preview_label %}<span class="preview" title="A branch's code, not production; see the label for which record">{{ preview_label }}</span>{% endif %}
  <span class="grow"></span>
  <span class="block" id="block" title="Ethereum mainnet's block height"></span>
  <span class="servers" id="servers" title="Servers"></span>
  <button id="searchBtn" type="button" title="Search what was said (/)">⌕</button>
  <span class="status" id="status" title="connecting…"></span>
  <span class="account">
    <button id="userBtn" type="button" aria-haspopup="true" aria-expanded="false"></button>
    <div id="userMenu" hidden>
      <div class="auth" id="auth"></div>
      <label class="me">viewing as <select id="me"><option value="">nobody</option></select></label>
      <label class="only"><input type="checkbox" id="onlyMine"> only mentions of me</label>
      <button id="notify" type="button" hidden aria-label="Notifications"></button>
      <a href="#" id="devicesLink" hidden>your devices</a>
      <a class="settings" href="/motions/settings/" title="How each agent carries itself in each Mood">settings</a>
      <a href="#" id="signout" hidden>sign out</a>
    </div>
  </span>
</header>
<div id="devicesBox" hidden role="dialog" aria-label="Your devices">
  <div class="head"><b>Your devices</b> <button type="button" id="devicesClose">close</button></div>
  <div id="devicesList"></div>
</div>
<form id="renameBox" hidden>
  <input id="renameTitle" maxlength="200" aria-label="Title" placeholder="Title">
  <textarea id="renameDesc" rows="2" maxlength="2000" aria-label="Description" placeholder="What it's about (optional)"></textarea>
  <span><button type="submit">Rename</button> <button type="button" id="renameCancel">Cancel</button>
    <button type="button" id="archiveBtn" class="archive" title="Out of the Moods list, into Archived. It stays readable, its sessions and container untouched, and a mention there is still answered.">Archive</button></span>
</form>
<form id="newBox" hidden>
  <input id="newTitle" maxlength="200" aria-label="Title" placeholder="What the new Mood is about">
  <textarea id="newDesc" rows="2" maxlength="2000" aria-label="Description" placeholder="A line or two more (optional)"></textarea>
  <span class="hint">Its first @magent starts a new session there, briefed by the letter magent left itself.</span>
  <span><button type="submit">Start</button> <button type="button" id="newCancel">Cancel</button></span>
</form>
<div id="locked"></div>
<div id="search" hidden role="search">
  <div class="bar">
    <input id="q" type="search" placeholder="Search what was said" aria-label="Search what was said" autocomplete="off">
    <select id="qscope" aria-label="Where"><option value="here">this Mood</option><option value="all">all Moods</option></select>
    <button type="button" id="qclose" aria-label="Close search">close</button>
  </div>
  <div id="qresults"></div>
</div>
<div class="layout">
  <nav id="nav"><div id="moodList"><div class="label">Moods</div></div>
    <details id="recent"><summary>Recent changes</summary><div id="recentList"></div></details>
    <details id="work"><summary>Open work</summary><div id="workList"></div></details></nav>
  <div id="grip" title="Drag to resize; double-click to reset"></div>
  <main id="main"><div class="inner" id="inner"><div class="empty">Loading…</div></div>
    <div id="footer">
    <div id="jump"><button type="button" class="human" id="jumpHumanUp" title="previous message from a person" aria-label="previous message from a person">↑</button><button type="button" id="jumpUp" title="previous message" aria-label="previous message">↑</button><button type="button" class="forme" id="jumpMeUp" title="previous message for you: a mention, or an answer" aria-label="previous message for you">@↑</button><button type="button" class="human" id="jumpHumanDown" title="next message from a person" aria-label="next message from a person">↓</button><button type="button" id="jumpDown" title="next message" aria-label="next message">↓</button><button type="button" class="forme" id="jumpMeDown" title="next message for you: a mention, or an answer" aria-label="next message for you">@↓</button></div>
    <button type="button" id="toBottom">↓ newest</button>
    <div id="typing"></div>
    <div id="tasks"></div>
    <div id="activity"><span class="dot"></span><span id="activityText"></span><button type="button" id="stopBtn" title="Stop it, as Esc does in a terminal (Esc in the message box does the same). What was said stays; add to it and it reads both." hidden>■ stop</button></div>
    <div class="hush" id="hush"></div>
    <form id="composer" autocomplete="off">
      <div id="suggest"></div>
      <button type="button" id="agentsBtn" title="Agents here: listening, model, effort" aria-label="Agent settings" aria-expanded="false">⚙</button>
      <button type="button" id="attach" title="Add an image (or paste or drop one)" aria-label="Add an image">＋</button>
      <input type="file" id="file" accept="image/png,image/jpeg,image/gif,image/webp" multiple hidden>
      <textarea id="say" placeholder="Say something. @name to address someone; [[Page]] links PickiPedia. Enter sends; Ctrl+Enter for a new line." rows="2"></textarea>
      <button type="submit" id="send" aria-label="Send"><span class="label">Send</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20.5 21 12 3 3.5 3 10l12 2-12 2z" fill="currentColor"/></svg></button>
    </form>
    </div>
  </main>
</div>

<script>
(function () {
  const POLL_MS = 4000;
  const initialSlug = "{{ initial_slug|escapejs }}" || null;
  const nav = document.getElementById('nav');
  const inner = document.getElementById('inner');
  const main = document.getElementById('main');
  const status = document.getElementById('status');
  const meSelect = document.getElementById('me');
  const onlyMine = document.getElementById('onlyMine');
  // Signed in only if this browser was enrolled with an SSH key; see
  // services/motion_auth.py. Reading never needs it.
  const viewer = "{{ viewer|escapejs }}" || null;
  const auth = document.getElementById('auth');
  const composer = document.getElementById('composer');
  const sayBox = document.getElementById('say');
  const sendBtn = document.getElementById('send');

  // Who is looking. Lives in the browser: the view has no accounts, and a
  // filter is not a permission. Everything here stays readable to anyone.
  const store = {
    get(k, d) { try { const v = localStorage.getItem('motions.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('motions.' + k, JSON.stringify(v)); } catch (e) {} },
  };

  let motions = [];
  let names = new Set();
  let current = null;       // slug
  let lastId = null;        // last turn id rendered, for ?after=
  let me = viewer || store.get('me', '') || '';
  let lastSeen = store.get('lastSeen', {});   // slug -> iso
  let badges = {};          // slug -> count of my mentions since lastSeen
  let baseTitle = 'magenta';
  let people = [];          // everyone who can be named, for @-completion
  let human = {};           // name -> is a person
  let act = null;           // what an agent is doing now, from /turns/
  let typingNow = [];       // who else is typing here, from /turns/

  const ICONS = {
    human: '<svg class="ico" viewBox="0 0 16 16" aria-label="person"><circle cx="8" cy="4.6" r="3"/><path d="M2.2 15c0-3.4 2.6-5.6 5.8-5.6s5.8 2.2 5.8 5.6z"/></svg>',
    agent: '<svg class="ico" viewBox="0 0 16 16" aria-label="agent"><circle cx="8" cy="1.8" r="1.2"/><rect x="7.4" y="2" width="1.2" height="2.6"/><rect x="2.5" y="4.4" width="11" height="9.2" rx="2.4"/><rect x="0.6" y="7.6" width="1.4" height="3" rx=".6"/><rect x="14" y="7.6" width="1.4" height="3" rx=".6"/><circle cx="5.9" cy="8.6" r="1.25" fill="#fff"/><circle cx="10.1" cy="8.6" r="1.25" fill="#fff"/><rect x="5.6" y="11.1" width="4.8" height="1" rx=".5" fill="#fff"/></svg>',
  };
  function icon(name, isHuman) {
    const h = isHuman === undefined ? !!human[name] : isHuman;
    return h ? ICONS.human : ICONS.agent;
  }

  // Which model, at what effort, an agent's turn ran on.
  function how(item) {
    const bits = [item.model, item.effort].filter(Boolean);
    return bits.length ? `<span class="how" title="model · effort">${esc(bits.join(' · '))}</span>` : '';
  }

  function setStatus(text, cls) { status.textContent = text; status.title = text; status.className = 'status ' + (cls || ''); }
  function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function ago(iso) {
    if (!iso) return 'never';
    const s = Math.max(0, (Date.now() - new Date(iso)) / 1000);
    if (s < 60) return 'just now';
    if (s < 3600) return Math.floor(s / 60) + 'm ago';
    if (s < 86400) return Math.floor(s / 3600) + 'h ago';
    return Math.floor(s / 86400) + 'd ago';
  }
  function stamp(iso) {
    return new Date(iso).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
  }
  function setTitle() {
    const n = Object.values(badges).reduce((a, b) => a + b, 0);
    document.title = (n ? '(' + n + ') ' : '') + baseTitle;
    // The installed app's icon carries the count too, where the system allows.
    try { if (navigator.setAppBadge) (n ? navigator.setAppBadge(n) : navigator.clearAppBadge()); } catch (e) {}
  }

  let archivedOpen = false;
  function renderNav() {
    const item = m => `
      <a class="motion ${m.slug === current ? 'active' : ''}" href="/motions/${encodeURIComponent(m.slug)}/" data-slug="${esc(m.slug)}">
        <div class="title">${esc(m.title)}${badges[m.slug] ? `<span class="badge">${badges[m.slug]}</span>` : ''}</div>
        <div class="meta">${m.message_count.toLocaleString()} · ${ago(m.last_at)}</div>
        <div class="meta people-line">${peopleLine(m.slug)}</div>
      </a>`;
    const live = motions.filter(m => !m.archived), archived = motions.filter(m => m.archived);
    // The one open stays in view: an archived Mood opened shows its fold open.
    const open = archivedOpen || archived.some(m => m.slug === current);
    document.getElementById('moodList').innerHTML =
      `<div class="label">Moods${viewer ? '<button type="button" id="newMood" title="Start a Mood" aria-label="Start a Mood">＋</button>' : ''}</div>`
      + live.map(item).join('')
      + (archived.length ? `<details id="archived"${open ? ' open' : ''}><summary>Archived (${archived.length})</summary>`
         + archived.map(item).join('') + '</details>' : '');
    const fold = document.getElementById('archived');
    if (fold) fold.addEventListener('toggle', () => { archivedOpen = fold.open; });
    markLive();
  }

  // Who's around in each Mood: whoever spoke in the last 100 blocks (about 20
  // minutes), and whoever is typing or at work there now, their name pulsing.
  let liveData = {};
  function aroundIn(slug) {
    const d = liveData[slug] || { speakers: [], typing: [], busy: null };
    const typing = new Set(slug === current ? [...d.typing, ...typingNow] : d.typing);
    const busy = slug === current && act && act.doing !== 'held' ? act.agent : d.busy;
    const names = [...new Set([...(busy ? [busy] : []), ...typing, ...d.speakers])];
    return { names, active: new Set([...typing, ...(busy ? [busy] : [])]) };
  }
  function peopleLine(slug) {
    const { names, active } = aroundIn(slug);
    return names.map(n => `<span class="nm${active.has(n) ? ' live' : ''}" data-who="${esc(n)}">${esc(n)}</span>`).join(', ');
  }
  function markLive() {
    nav.querySelectorAll('a.motion').forEach(a => {
      const line = a.querySelector('.people-line');
      const html = peopleLine(a.dataset.slug);
      if (line && line.innerHTML !== html) line.innerHTML = html;
    });
  }
  async function refreshLive() {
    try {
      const r = await fetch('/api/motions/live/');
      if (r.ok) { liveData = (await r.json()).motions || {}; markLive(); }
    } catch (e) {}
  }
  setInterval(refreshLive, 5000);
  refreshLive();

  // --- the chain's height: from the explorer now and then, a block every 12 s between ---
  const blockEl = document.getElementById('block');
  let blockAnchor = null;
  async function refreshBlock() {
    try {
      const b = await (await fetch('/api/block/')).json();
      if (b.height) blockAnchor = b;
    } catch (e) {}
    tickBlock();
  }
  function tickBlock() {
    if (!blockAnchor) { blockEl.textContent = ''; return; }
    const since = Math.max(0, (Date.now() - new Date(blockAnchor.at).getTime()) / 1000);
    const height = blockAnchor.height + Math.floor(since / blockAnchor.seconds);
    blockEl.textContent = '⛓ ' + height.toLocaleString();
    blockEl.title = `Ethereum mainnet, about block ${height.toLocaleString()} (counted on from the explorer's ${blockAnchor.height.toLocaleString()})`;
  }
  setInterval(tickBlock, 3000);
  setInterval(refreshBlock, 5 * 60 * 1000);
  refreshBlock();

  const grip = document.getElementById('grip');
  const NAV_MIN = 140, NAV_MAX = 480;
  function navWidth(w) {
    if (w) document.documentElement.style.setProperty('--nav-width', Math.max(NAV_MIN, Math.min(NAV_MAX, w)) + 'px');
    else document.documentElement.style.removeProperty('--nav-width');
  }
  navWidth(store.get('navWidth', 0));
  grip.addEventListener('pointerdown', e => {
    e.preventDefault();
    grip.setPointerCapture(e.pointerId);
    document.body.classList.add('sizing');
  });
  grip.addEventListener('pointermove', e => {
    if (document.body.classList.contains('sizing')) navWidth(e.clientX - nav.getBoundingClientRect().left);
  });
  grip.addEventListener('pointerup', () => {
    document.body.classList.remove('sizing');
    store.set('navWidth', Math.round(nav.getBoundingClientRect().width));
  });
  grip.addEventListener('dblclick', () => { navWidth(0); store.set('navWidth', 0); });

  function renderMe() {
    const opts = ['<option value="">nobody</option>'].concat(
      [...names].sort().map(n => `<option value="${esc(n)}" ${n === me ? 'selected' : ''}>${esc(n)}</option>`));
    meSelect.innerHTML = opts.join('');
    document.body.classList.toggle('has-me', !!me);
    renderBell();
    if (!me) { onlyMine.checked = false; document.body.classList.remove('only-mine'); }
  }

  function markTurn(el, mentions) {
    el.classList.toggle('mentions-me', !!me && mentions.includes(me));
    el.querySelectorAll('.mention').forEach(s => s.classList.toggle('me', s.dataset.who === me));
  }

  function renderHead(m) {
    const block = m.eth_blockheight ? 'opened at block ' + m.eth_blockheight.toLocaleString() : '';
    return `<div class="motion-head">
      <h1>${esc(m.title)}</h1>
      ${m.description ? `<p class="desc">${esc(m.description)}</p>` : ''}
      <div class="meta">${block ? block + ' · ' : ''}${m.message_count} messages in the record ·
        <a href="/motions/${encodeURIComponent(m.slug)}/rules/" title="What magent is told here: this Mood's rules, its settings, what each wake says">rules</a></div>
      <div class="people" id="people">${m.participants.map(n =>
        `<span class="who ${human[n] ? 'human' : 'agent'}" data-who="${esc(n)}">${icon(n)}${esc(n)}</span>`).join('')}</div>
    </div><button id="earlier" type="button" hidden>Load earlier</button><div id="turns"></div>`;
  }

  const RUN_MS = 5 * 60 * 1000;  // the same sender within this is one run
  let prev = null;               // the last turn rendered: {sender, at}

  function turnEl(t, isNew) {
    const el = document.createElement('article');
    const at = new Date(t.created_at).getTime();
    const cont = prev && prev.sender === t.sender && at - prev.at < RUN_MS;
    prev = { sender: t.sender, at };
    el.className = 'turn ' + (t.is_human ? 'human' : 'agent') + (cont ? ' cont' : '') + (isNew ? ' new' : '');
    if (cont) el.title = t.sender + ' · ' + stamp(t.created_at);
    el.dataset.mentions = JSON.stringify(t.mentions || []);
    el.dataset.id = t.id;
    el.id = 'm-' + t.id;
    if (forMe.has(t.id)) el.classList.add('for-me');
    const signed = t.attested ? `<button type="button" class="signed" title="Signed with ${esc(t.sender)}'s SSH key: click for the proof">✓ signed</button>` : '';
    el.innerHTML = `<div class="who"><span class="name">${icon(t.sender, t.is_human)}${esc(t.sender)}</span><a class="permalink" href="#m-${esc(t.id)}" title="This message's link: click to copy (paste it with an @mention to have an agent read from here)"><time datetime="${t.created_at}">${stamp(t.created_at)}</time></a>${how(t)}${signed}</div><div class="body">${t.html}</div>`;
    if (t.attested) el._proof = t.attested;
    markTurn(el, t.mentions || []);
    return el;
  }

  // --- tool steps: grouped into one collapsed line per run of work ----------
  function workEl(s, container) {
    const last = container.lastElementChild;
    if (last && last.classList.contains('work') && last.dataset.sender === s.sender) return last;
    const at = new Date(s.created_at).getTime();
    const cont = prev && prev.sender === s.sender && at - prev.at < RUN_MS;
    const el = document.createElement('div');
    el.className = 'work' + (cont ? ' cont' : '');
    el.dataset.sender = s.sender;
    el.innerHTML = `<div class="who"><span class="name">${icon(s.sender, false)}${esc(s.sender)}</span><time datetime="${esc(s.created_at)}">${stamp(s.created_at)}</time>${how(s)}</div>`
      + `<button class="work-head" type="button"><span class="caret">▸</span><span class="what"></span></button><div class="steps"></div>`;
    container.appendChild(el);
    return el;
  }
  function describeWork(el) {
    const counts = {};
    el.querySelectorAll('.step').forEach(s => { counts[s.dataset.verb] = (counts[s.dataset.verb] || 0) + 1; });
    const n = el.querySelectorAll('.step').length;
    const parts = Object.entries(counts).sort((a, b) => b[1] - a[1]).map(([v, c]) => c > 1 ? `${v} ×${c}` : v);
    el.querySelector('.what').textContent = `${n} step${n === 1 ? '' : 's'} · ${parts.join(', ')}`;
  }
  function addStep(s, container) {
    const work = workEl(s, container);
    const row = document.createElement('div');
    row.className = 'step';
    row.dataset.id = s.id; row.dataset.verb = s.verb;
    row.innerHTML = `<button class="step-head" type="button"><code>${esc(s.tool.replace(/^mcp__/, ''))}</code><span class="sum">${esc(s.summary || s.verb)}</span></button><div class="step-detail"></div>`;
    work.querySelector('.steps').appendChild(row);
    if (s.images && s.images.length) {
      let thumbs = work.querySelector('.thumbs');
      if (!thumbs) {
        thumbs = document.createElement('div'); thumbs.className = 'thumbs';
        work.insertBefore(thumbs, work.querySelector('.steps'));
      }
      for (const url of s.images) thumbs.insertAdjacentHTML('beforeend', `<a href="${esc(url)}" target="_blank" rel="noopener"><img src="${esc(url)}" alt="from ${esc(s.tool)}" loading="lazy"></a>`);
    }
    describeWork(work);
    prev = { sender: s.sender, at: new Date(s.created_at).getTime() };
  }
  function pre(text, cls) { return `<pre${cls ? ` class="${cls}"` : ''}>${esc(text)}</pre>`; }
  function diff(oldText, newText) {
    const lines = [];
    String(oldText || '').split('\n').forEach(l => lines.push(`<span class="del">- ${esc(l)}</span>`));
    String(newText || '').split('\n').forEach(l => lines.push(`<span class="add">+ ${esc(l)}</span>`));
    return `<pre>${lines.join('\n')}</pre>`;
  }
  function renderDetail(d) {
    const a = d.input || {};
    let ask = '';
    if (d.tool === 'Bash') ask = `<pre><span class="dim">$ </span>${esc(a.command || '')}</pre>`;
    else if (d.tool === 'Edit') ask = `<div class="label">${esc(a.file_path || '')}</div>` + diff(a.old_string, a.new_string);
    else if (d.tool === 'Write') ask = `<div class="label">${esc(a.file_path || '')}</div>` + pre(a.content || '');
    else ask = pre(JSON.stringify(a, null, 2));
    let out = '';
    if (d.result) {
      const shots = (d.result.text || '').match(/\/motions\/media\/[0-9a-f]{64}\.(?:png|jpg|gif|webp)/g) || [];
      const text = (d.result.text || '').replace(/!\[[^\]]*\]\(\/motions\/media\/[^)]+\)\n?/g, '').trim() || (shots.length ? '' : '(no output kept)');
      out = `<div class="${d.result.is_error ? 'err' : ''}"><div class="label">${d.result.is_error ? 'error' : 'result'}</div>${text ? pre(text) : ''}`
        + (shots.length ? `<div class="shots">${shots.map(u => `<a href="${esc(u)}" target="_blank" rel="noopener"><img src="${esc(u)}" alt="" loading="lazy"></a>`).join('')}</div>` : '')
        + `</div>`;
    }
    const heading = ['Edit', 'Write'].includes(d.tool) ? '' : `<div class="label">${esc(d.verb)}</div>`;
    return heading + ask + out;
  }
  document.addEventListener('click', async e => {
    const head = e.target.closest('.work-head');
    if (head) { head.parentElement.classList.toggle('open'); return; }
    const stepHead = e.target.closest('.step-head');
    if (!stepHead) return;
    const step = stepHead.parentElement;
    step.classList.toggle('open');
    const box = step.querySelector('.step-detail');
    if (!step.classList.contains('open') || box.dataset.loaded) return;
    box.textContent = 'loading…';
    try {
      const r = await fetch(`/api/motions/${encodeURIComponent(current)}/steps/${encodeURIComponent(step.dataset.id)}/`);
      if (!r.ok) throw new Error(r.status);
      const d = await r.json();
      box.innerHTML = renderDetail(d);
      box.dataset.loaded = '1';
      if (d.result && d.result.is_error) step.classList.add('err');
    } catch (err) { box.textContent = 'could not load this step'; }
  });

  function addThought(t, container) {
    const el = document.createElement('div');
    el.className = 'thought';
    el.title = `${t.sender} thinking · ${stamp(t.created_at)}`;
    el.textContent = t.text;
    container.appendChild(el);
    prev = { sender: t.sender, at: new Date(t.created_at).getTime() };
  }

  function took(seconds) {
    if (seconds == null) return '';
    return seconds < 90 ? ` in ${seconds}s` : ` in ${Math.round(seconds / 60)}m`;
  }
  function addEvent(e, container) {
    const el = document.createElement('div');
    if (e.type === 'interrupt' || e.type === 'created') {  // someone pressed stop; someone started this Mood
      el.className = 'event';
      el.innerHTML = e.type === 'created'
        ? `✦ <b>${esc(e.by || 'someone')}</b> started this Mood · ${esc(stamp(e.created_at))}`
        : `■ <b>${esc(e.by || 'someone')}</b> stopped ${esc(e.agent || 'the agent')} · ${esc(stamp(e.created_at))}`;
      container.appendChild(el);
      prev = null;
      return;
    }
    el.className = 'event ' + (e.state || '');
    const commit = e.commit ? ` · <code>${esc(e.commit.slice(0, 8))}</code>` : '';
    const by = e.by ? ` · by ${esc(e.by)}` : '';
    el.innerHTML = e.state === 'started' ? `⚙ <b>${esc(e.server)}</b> redeploying…${by}${commit} · ${esc(stamp(e.created_at))}`
      : e.state === 'failed' ? `✗ <b>${esc(e.server)}</b> redeploy failed${took(e.took)}${by} · ${esc(stamp(e.created_at))}`
      : `✓ <b>${esc(e.server)}</b> redeployed${took(e.took)}${commit}${by} · ${esc(stamp(e.created_at))}`;
    container.appendChild(el);
    prev = null;
    refreshServers(true);  // the dots, now
  }

  // An attestation's proof: what was signed, the signature, the key, and how to check it anywhere.
  document.addEventListener('click', e => {
    const b = e.target.closest('.signed');
    if (!b) return;
    const turn = b.closest('.turn');
    const open = turn.querySelector('.proof');
    if (open) { open.remove(); return; }
    const p = turn._proof || {};
    const box = document.createElement('div');
    box.className = 'proof';
    box.innerHTML = `What was signed:<pre>${esc(p.signed)}</pre>Signature:<pre>${esc(p.signature)}</pre>`
      + `Key:<pre>${esc(p.key || '(not on file)')}</pre>To check it: put the key in an allowed_signers line `
      + `(<code>${esc(turn.querySelector('.name').innerText)} ${esc(p.key || '')}</code>), the signature in a file, and run `
      + `<code>ssh-keygen -Y verify -f allowed_signers -I ${esc(turn.querySelector('.name').innerText)} -n ${esc(p.namespace)} -s sig</code> with what was signed on its input.`;
    turn.appendChild(box);
  });

  // --- the servers: four dots, pulsing while one is redeployed ------------------
  const serversEl = document.getElementById('servers');
  const serverPop = document.createElement('div');
  serverPop.id = 'serverPop'; serverPop.hidden = true;
  document.querySelector('header').appendChild(serverPop);
  let serversAt = 0, serverList = [];
  async function refreshServers(force) {
    if (!force && Date.now() - serversAt < 60000) return;
    serversAt = Date.now();
    try {
      const r = await fetch('/api/servers/');
      if (!r.ok) return;
      serverList = (await r.json()).servers;
    } catch (e) { return; }
    serversEl.innerHTML = serverList.map(sv => {
      const state = sv.deploying ? 'deploying' : sv.up ? 'up' : 'down';
      const words = sv.deploying ? 'redeploying' : sv.up ? 'up' : 'not answering';
      return `<span class="srv ${state}" title="${esc(sv.name)}: ${esc(words)}"></span>`;
    }).join('');
    if (!serverPop.hidden) renderServerPop();
  }
  function renderServerPop() {
    serverPop.innerHTML = serverList.map(sv => {
      const d = sv.deploy;
      const last = d ? (d.state === 'started' && sv.deploying ? `redeploying since ${ago(d.at)}`
        : `${d.state === 'failed' ? 'redeploy failed' : 'redeployed'} ${ago(d.at)}${d.commit ? ' · ' + d.commit.slice(0, 8) : ''}`) : 'no redeploy told yet';
      return `<div><b>${esc(sv.name)}</b> · ${sv.deploying ? 'redeploying' : sv.up ? 'up' : '<b>not answering</b>'}`
        + `<br><span class="note">${esc(sv.about)} · ${esc(last)}</span></div>`;
    }).join('');
  }
  serversEl.addEventListener('click', e => {
    e.stopPropagation();
    serverPop.hidden = !serverPop.hidden;
    if (!serverPop.hidden) renderServerPop();
  });
  document.addEventListener('click', e => { if (!serverPop.hidden && !e.target.closest('#serverPop')) serverPop.hidden = true; });
  setInterval(() => refreshServers(false), 60000);
  refreshServers(true);

  function addCompaction(c, container) {
    const el = document.createElement('details');
    el.className = 'compaction';
    // The summary is the server's own rendering of the harness's text (render_html).
    el.innerHTML = `<summary>context compacted · ${esc(stamp(c.created_at))} · the summary it went on from</summary>`
      + `<div class="body">${c.html}</div>`;
    container.appendChild(el);
    prev = null;  // whoever speaks next starts afresh
  }

  // --- up and down a message at a time --------------------------------------
  function jump(dir, only = '') {
    const top = main.getBoundingClientRect().top;
    const sel = only ? only.split(',').map(c => '#turns .turn' + c.trim()).join(', ') : '#turns .turn';
    const turns = [...document.querySelectorAll(sel)].filter(t => !t.closest('.aturn.folded') || t.closest('.abody') === null);
    const at = t => t.getBoundingClientRect().top - top;
    const target = dir > 0 ? turns.find(t => at(t) > 16) : turns.reverse().find(t => at(t) < -16);
    if (target) main.scrollTo({ top: main.scrollTop + at(target) - 8, behavior: 'smooth' });
    else if (dir > 0) main.scrollTo({ top: main.scrollHeight, behavior: 'smooth' });
    else {
      const earlier = document.getElementById('earlier');
      if (earlier && !earlier.hidden) earlier.click();  // past the top: bring in the page before
      else main.scrollTo({ top: 0, behavior: 'smooth' });
    }
  }
  document.getElementById('jumpUp').addEventListener('click', () => jump(-1));
  document.getElementById('jumpDown').addEventListener('click', () => jump(1));
  document.getElementById('jumpMeUp').addEventListener('click', () => jump(-1, '.mentions-me, .for-me'));
  document.getElementById('jumpMeDown').addEventListener('click', () => jump(1, '.mentions-me, .for-me'));
  for (const [id, dir] of [['jumpHumanUp', -1], ['jumpHumanDown', 1]]) {
    const b = document.getElementById(id);
    b.innerHTML = ICONS.human + b.textContent;
    b.addEventListener('click', () => jump(dir, '.human'));
  }

  // --- renaming a Mood: its title and description; the slug never changes ---
  // The pencil sits by the Mood's name in the top bar, where it's always in view.
  let headMotion = null;  // the Motion the head was last drawn for
  const crumb = document.getElementById('crumb');
  const renameBox = document.getElementById('renameBox');
  function showMotionName(m) {
    headMotion = m;
    crumb.innerHTML = m ? esc(m.title) + (viewer ? '<button type="button" id="rename" title="Rename this Mood" aria-label="Rename this Mood">✎</button>' : '') : '';
    const h1 = document.querySelector('.motion-head h1');
    if (h1 && m) h1.textContent = m.title;
    if (m) { baseTitle = m.title + ' · magenta'; setTitle(); }
  }
  const isArchived = slug => !!(motions.find(m => m.slug === slug) || {}).archived;
  const newBox = document.getElementById('newBox');
  document.addEventListener('click', async e => {
    if (e.target.closest('#rename')) {
      document.getElementById('renameTitle').value = headMotion.title;
      document.getElementById('renameDesc').value = headMotion.description || '';
      document.getElementById('archiveBtn').textContent = isArchived(current) ? 'Unarchive' : 'Archive';
      renameBox.hidden = false;
      document.getElementById('renameTitle').focus();
    } else if (e.target.closest('#renameCancel')) {
      renameBox.hidden = true;
    } else if (e.target.closest('#archiveBtn')) {
      const r = await fetch(`/api/motions/${encodeURIComponent(current)}/archive/`, {
        method: 'POST', headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrf() },
        body: JSON.stringify({ archived: !isArchived(current) }),
      });
      if (!r.ok) { showError('archive: ' + ((await r.json().catch(() => ({}))).error || r.status)); return; }
      renameBox.hidden = true;
      loadMotions();
    } else if (e.target.closest('#newMood')) {
      document.getElementById('newTitle').value = '';
      document.getElementById('newDesc').value = '';
      newBox.hidden = false;
      document.getElementById('newTitle').focus();
    } else if (e.target.closest('#newCancel')) {
      newBox.hidden = true;
    }
  });
  newBox.addEventListener('submit', async e => {
    e.preventDefault();
    const r = await fetch('/api/motions/new/', {
      method: 'POST', headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrf() },
      body: JSON.stringify({ title: document.getElementById('newTitle').value,
                             description: document.getElementById('newDesc').value }),
    });
    if (!r.ok) { showError('new Mood: ' + ((await r.json().catch(() => ({}))).error || r.status)); return; }
    const made = await r.json();
    newBox.hidden = true;
    await loadMotions();
    open(made.slug, true);
  });
  renameBox.addEventListener('submit', async e => {
    e.preventDefault();
    const r = await fetch(`/api/motions/${encodeURIComponent(current)}/rename/`, {
      method: 'POST', headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrf() },
      body: JSON.stringify({ title: document.getElementById('renameTitle').value,
                             description: document.getElementById('renameDesc').value }),
    });
    if (!r.ok) { showError('rename: ' + ((await r.json().catch(() => ({}))).error || r.status)); return; }
    const named = await r.json();
    renameBox.hidden = true;
    showMotionName({ ...headMotion, ...named });
    const desc = document.querySelector('.motion-head .desc');
    if (desc) desc.textContent = named.description || '';
    loadMotions();
  });

  function addQuiet(q, container) {
    let row = container.lastElementChild;
    if (!row || !row.classList.contains('quiet')) {
      row = document.createElement('div'); row.className = 'quiet';
      container.appendChild(row);
    }
    const dot = document.createElement('button');
    dot.type = 'button'; dot.className = 'dot' + (q.by === 'screen' ? ' screened' : '');
    dot.title = q.by === 'screen'
      ? `screened for ${q.sender}: let pass without waking it · ${stamp(q.created_at)}`
      : `${q.sender} chose not to speak · ${stamp(q.created_at)}`;
    dot.dataset.why = q.reason || '(no reason given)';
    row.appendChild(dot);
  }
  document.addEventListener('click', e => {
    const dot = e.target.closest('.quiet .dot');
    if (!dot) return;
    const row = dot.parentElement;
    const wasOn = dot.classList.contains('on');
    row.querySelectorAll('.dot').forEach(d => d.classList.remove('on'));
    let why = row.querySelector('.why');
    if (wasOn) { if (why) why.remove(); return; }
    dot.classList.add('on');
    if (!why) { why = document.createElement('div'); why.className = 'why'; row.appendChild(why); }
    why.textContent = dot.title + ': ' + dot.dataset.why;
  });

  // Turns, steps and dots from one response, in the order they happened.
  function itemsOf(data) {
    return [...(data.turns || []).map(t => ({ kind: 'turn', v: t })), ...(data.steps || []).map(s => ({ kind: 'step', v: s })),
            ...(data.quiet || []).map(q => ({ kind: 'quiet', v: q })),
            ...(data.thoughts || []).map(t => ({ kind: 'thought', v: t })),
            ...(data.compactions || []).map(c => ({ kind: 'compaction', v: c })),
            ...(data.events || []).map(e => ({ kind: 'event', v: e }))]
      .sort((a, b) => a.v.created_at < b.v.created_at ? -1 : a.v.created_at > b.v.created_at ? 1 : 0);
  }
  // A message's link: /motions/<slug>/#m-<id>. Clicking its time copies it.
  document.addEventListener('click', async e => {
    const a = e.target.closest('a.permalink');
    if (!a) return;
    e.preventDefault();
    const url = `${location.origin}/motions/${encodeURIComponent(current)}/${a.getAttribute('href')}`;
    try { await navigator.clipboard.writeText(url); a.dataset.copied = '1'; setTimeout(() => delete a.dataset.copied, 1500); }
    catch (err) { history.replaceState(history.state, '', url); }
  });

  // --- an agent's turn, gathered under one header --------------------------------
  // Everything an agent did between a person's words and its turn's end -- its
  // words along the way, its thinking, its steps -- in one block: a header
  // (who, how long, on what, how many tokens) that folds the rest away.
  function agentOf(it) {
    if (it.kind === 'turn') return it.v.is_human ? null : it.v.sender;
    return it.kind === 'step' || it.kind === 'thought' ? it.v.sender : null;
  }
  function kTokens(n) {
    if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
    if (n >= 1000) return (n < 10000 && n % 1000 ? (n / 1000).toFixed(1) : Math.round(n / 1000)) + 'k';
    return String(n);
  }
  function blockFor(container, agent, v) {
    const last = container.lastElementChild;
    if (last && last.classList.contains('aturn') && !last._ended && last._agent === agent) return last;
    closeBlock(container);  // another agent's turn begins
    const b = document.createElement('section');
    b.className = 'aturn';
    const at = new Date(v.created_at).getTime() / 1000;
    // From the words that set it going, when they're just before it.
    const asked = container._askedAt && container._askedAt <= at && at - container._askedAt < 6 * 3600 ? container._askedAt : at;
    Object.assign(b, { _agent: agent, _start: asked, _end: at, _out: 0, _ctx: 0, _seen: new Set(), _how: {}, _ended: false, _final: '' });
    b.innerHTML = '<button type="button" class="ahead"></button><div class="abody"></div>';
    container.appendChild(b);
    return b;
  }
  function tally(b, v) {
    b._end = Math.max(b._end, new Date(v.created_at).getTime() / 1000);
    if (v.out != null) {
      const usage = v.out + ':' + v.ctx;  // one response stored as several rows carries one usage
      if (!b._seen.has(usage)) { b._seen.add(usage); b._out += v.out; }
      if (v.ctx) b._ctx = v.ctx;
    }
    if (v.model) b._how.model = v.model;
    if (v.effort) b._how.effort = v.effort;
  }
  function drawBlockHead(b) {
    const took = Math.max(0, Math.round(b._end - b._start));
    const how = [b._how.model, b._how.effort].filter(Boolean).join(' · ');
    const tokens = b._out || b._ctx ? `${kTokens(b._out)} out · ${kTokens(b._ctx)} context` : '';
    b.querySelector('.ahead').innerHTML = `<span class="caret">${b.classList.contains('folded') ? '▸' : '▾'}</span>`
      + `${icon(b._agent, false)}<b>${esc(b._agent)}</b>`
      + [took ? elapsed(Date.now() / 1000 - took) : '', how, tokens].filter(Boolean).map(x => ' · ' + esc(x)).join('')
      + (!b._ended && isWorking(b) ? ' · working…' : '')
      + `<span class="preview">${esc(b._final)}</span>`;
  }
  // Working only if it's the newest thing here and the agent is at work now.
  function isWorking(b) {
    return b.parentNode && b.parentNode.lastElementChild === b && act && act.agent === b._agent && act.doing !== 'held';
  }
  // A turn that a person spoke after is over, whether or not its end was marked.
  function closeBlock(container) {
    const last = container.lastElementChild;
    if (last && last.classList.contains('aturn') && !last._ended) { last._ended = true; drawBlockHead(last); }
  }

  function foldOld(container, keepNewest = true) {
    // Older finished turns fold away; the newest stays open.
    const blocks = [...container.querySelectorAll(':scope > .aturn')];
    (keepNewest ? blocks.slice(0, -1) : blocks).forEach(b => { if (b._ended && !b.classList.contains('folded')) { b.classList.add('folded'); drawBlockHead(b); } });
  }
  document.addEventListener('click', e => {
    const head = e.target.closest('.ahead');
    if (!head) return;
    const b = head.closest('.aturn');
    b.classList.toggle('folded');
    drawBlockHead(b);
  });

  function renderItems(items, container, isNew) {
    for (const it of items) {
      const agent = agentOf(it);
      if (agent) {
        const b = blockFor(container, agent, it.v);
        const body = b.querySelector('.abody');
        if (it.kind === 'turn') {
          body.appendChild(turnEl(it.v, isNew));
          if (it.v.stop === 'end_turn') { b._ended = true; b._final = (it.v.text || '').split('\n')[0].slice(0, 200); }
        } else if (it.kind === 'thought') addThought(it.v, body);
        else addStep(it.v, body);
        tally(b, it.v);
        drawBlockHead(b);
        continue;
      }
      closeBlock(container);
      if (it.kind === 'turn') {
        container.appendChild(turnEl(it.v, isNew));
        container._askedAt = new Date(it.v.created_at).getTime() / 1000;
      }
      else if (it.kind === 'quiet') addQuiet(it.v, container);
      else if (it.kind === 'compaction') addCompaction(it.v, container);
      else if (it.kind === 'event') addEvent(it.v, container);
      else addStep(it.v, container);
    }
  }

  function remarkAll() {
    document.querySelectorAll('.turn').forEach(el => markTurn(el, JSON.parse(el.dataset.mentions || '[]')));
  }

  async function loadMotions() {
    const r = await fetch('/api/motions/');
    if (!r.ok) throw new Error('motions ' + r.status);
    const body = await r.json();
    motions = body.motions;
    people = body.people || [];
    people.forEach(p => { human[p.name] = p.is_human; });
    motions.forEach(m => m.participants.forEach(p => names.add(p)));
    renderMe();
    renderNav();
  }

  // --- notices: mentions of `me`, and agents' answers to `me` ---------------
  // Badges on each Mood count what's unread there; with notifications on, a
  // new one also notifies (when this page is hidden, or it's in another Mood).
  // Asked every 15 s, and only for what's new since the last ask: the first
  // ask looks back to the oldest Mood seen (else a week), a scan on the server.
  const NOTICE_MS = 15000;
  const pageOpened = new Date().toISOString();
  let badgeCursor = null, badgeAt = 0;
  const counted = new Set();  // notices already seen, by turn id
  const forMe = new Set();    // answers to me, marked in the thread
  let unread = {};            // slug -> Map(turn id -> created_at)
  function resetBadges() { badges = {}; unread = {}; badgeCursor = null; badgeAt = 0; counted.clear(); forMe.clear(); }
  function countBadges() {
    badges = {};
    for (const [slug, ids] of Object.entries(unread)) if (ids.size) badges[slug] = ids.size;
  }
  async function refreshBadges(force) {
    if (!me) { badges = {}; renderNav(); setTitle(); return; }
    if (!force && Date.now() - badgeAt < NOTICE_MS) return;
    badgeAt = Date.now();
    const seen = Object.values(lastSeen).sort();
    const since = badgeCursor || seen[0] || new Date(Date.now() - 7 * 86400 * 1000).toISOString();
    // Next time, from a little before now: overlap is counted once (by id),
    // and a clock a few minutes off still misses nothing.
    const next = new Date(Date.now() - 5 * 60 * 1000).toISOString();
    try {
      const r = await fetch('/api/notices/' + encodeURIComponent(me) + '/?since=' + encodeURIComponent(since));
      if (!r.ok) return;
      const notices = (await r.json()).notices;
      // A Mood opened since this page loaded: list it first, so its badge
      // has somewhere to go and its notification its title.
      if (notices.some(n => !motions.some(m => m.slug === n.motion))) await loadMotions();
      for (const n of notices) {
        if (counted.has(n.turn.id)) continue;
        counted.add(n.turn.id);
        if (n.kind === 'answer') {
          forMe.add(n.turn.id);
          const el = document.getElementById('m-' + n.turn.id);
          if (el) el.classList.add('for-me');
        }
        const floor = lastSeen[n.motion];
        if (floor && n.turn.created_at <= floor) continue;  // seen already
        const looking = n.motion === current && !document.hidden;
        if (!looking) (unread[n.motion] = unread[n.motion] || new Map()).set(n.turn.id, n.turn.created_at);
        if (!looking && n.turn.created_at > pageOpened) notify(n);
      }
      badgeCursor = next;
    } catch (e) {}
    countBadges(); renderNav(); setTitle();
  }

  // Notifications: off until asked for, here, by this browser.
  const bell = document.getElementById('notify');
  let granted = false;  // what the browser said when asked (some report permission late)
  function notifying() {
    return 'Notification' in window && (granted || Notification.permission === 'granted') && store.get('notify', false);
  }
  function renderBell() {
    bell.hidden = !me || !('Notification' in window);
    bell.textContent = notifying() ? '🔔' : '🔕';
    bell.title = notifying() ? 'Notifying you of mentions and answers (click to stop)'
      : 'Notify me of mentions, and when an agent answers me';
  }
  bell.addEventListener('click', async () => {
    if (notifying()) store.set('notify', false);
    else if ((await Notification.requestPermission()) === 'granted') { granted = true; store.set('notify', true); }
    renderBell();
  });
  async function notify(n) {
    if (!notifying()) return;
    const mood = motions.find(m => m.slug === n.motion);
    const title = n.kind === 'answer' ? `${n.turn.sender} answered you` : `${n.turn.sender} mentioned you`;
    const options = { body: (mood ? mood.title + ': ' : '') + n.turn.text.slice(0, 160), tag: n.turn.id,
                      icon: '/motions/icon-192.png', data: { slug: n.motion, id: n.turn.id } };
    try {
      // Through the service worker: Android allows no other way.
      const reg = await navigator.serviceWorker.getRegistration('/motions/');
      if (reg) { await reg.showNotification(title, options); return; }
    } catch (e) {}
    try { new Notification(title, options); } catch (e) {}
  }

  // --- search: what was said, here or everywhere ------------------------------
  const searchBox = document.getElementById('search');
  const qInput = document.getElementById('q');
  const qScope = document.getElementById('qscope');
  const qResults = document.getElementById('qresults');
  let qTimer = null, qSeq = 0;
  function openSearch() {
    searchBox.style.top = document.querySelector('header').getBoundingClientRect().bottom + 'px';  // just below it
    searchBox.hidden = false;
    qInput.focus(); qInput.select();
    if (qInput.value.trim().length >= 2) runSearch();
  }
  function closeSearch() { searchBox.hidden = true; }
  function marked(text, q) {
    const safe = esc(text), needle = esc(q);
    const at = safe.toLowerCase().indexOf(needle.toLowerCase());
    return at < 0 ? safe : safe.slice(0, at) + '<mark>' + safe.slice(at, at + needle.length) + '</mark>' + safe.slice(at + needle.length);
  }
  async function runSearch() {
    const q = qInput.value.trim(), seq = ++qSeq;
    if (q.length < 2) { qResults.innerHTML = '<div class="note">Two letters at least.</div>'; return; }
    qResults.innerHTML = '<div class="note">Searching…</div>';
    const here = qScope.value === 'here' && current;
    try {
      const r = await fetch('/api/search/?q=' + encodeURIComponent(q) + (here ? '&motion=' + encodeURIComponent(current) : ''));
      const { hits } = await r.json();
      if (seq !== qSeq) return;  // a newer search is under way
      qResults.innerHTML = hits.map(h => `<a class="hit" href="/motions/${encodeURIComponent(h.motion)}/#m-${esc(h.id)}" data-slug="${esc(h.motion)}" data-id="${esc(h.id)}">`
        + `<b>${esc(h.sender)}</b>${here ? '' : ' in ' + esc(h.title)} · ${esc(stamp(h.created_at))}<span class="txt">${marked(h.text, q)}</span></a>`).join('')
        || `<div class="note">Nothing said ${here ? 'in this Mood' : 'in any Mood'} contains “${esc(q)}”.</div>`;
    } catch (e) { if (seq === qSeq) qResults.innerHTML = '<div class="note">Search failed; try again.</div>'; }
  }
  qInput.addEventListener('input', () => { clearTimeout(qTimer); qTimer = setTimeout(runSearch, 300); });
  qScope.addEventListener('change', runSearch);
  document.getElementById('searchBtn').addEventListener('click', () => (searchBox.hidden ? openSearch() : closeSearch()));
  document.getElementById('qclose').addEventListener('click', closeSearch);
  document.addEventListener('keydown', e => {
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement && document.activeElement.tagName);
    if (e.key === '/' && !typing) { e.preventDefault(); openSearch(); }
    else if (e.key === 'Escape' && !searchBox.hidden) closeSearch();
  });
  qResults.addEventListener('click', async e => {
    const a = e.target.closest('a.hit');
    if (!a) return;
    e.preventDefault();
    if (matchMedia('(max-width: 720px)').matches) closeSearch();
    if (a.dataset.slug !== current) await open(a.dataset.slug, true);
    if (!(await reveal(a.dataset.id))) showError('That message is further back than this page reaches.');
  });

  // --- recent changes, under the Moods list ---------------------------------
  const RECENT_MS = 30000;
  const recentBox = document.getElementById('recent');
  const recentList = document.getElementById('recentList');
  let recentAt = 0;
  recentBox.open = store.get('recentOpen', false);
  recentBox.addEventListener('toggle', () => { store.set('recentOpen', recentBox.open); if (recentBox.open) refreshRecent(true); });
  const VERBS = { said: '', answered: '', renamed: 'renamed', set: 'changed', opened: 'opened' };
  async function refreshRecent(force) {
    if (!recentBox.open || (!force && Date.now() - recentAt < RECENT_MS)) return;
    recentAt = Date.now();
    try {
      const r = await fetch('/api/motions/recent/');
      if (!r.ok) return;
