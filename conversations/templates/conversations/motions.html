      const { events } = await r.json();
      recentList.innerHTML = events.map(e => {
        const head = e.kind === 'deploy'
          ? `⚙ ${esc(e.text)}${e.who ? ' · by ' + esc(e.who) : ''}`
          : e.kind === 'opened'
          ? `<b>${esc(e.title)}</b> opened`
          : `${e.who ? `<b>${esc(e.who)}</b> ` : ''}${VERBS[e.kind] ? esc(VERBS[e.kind]) + ' ' : ''}in ${esc(e.title)}`;
        return `<a class="ev" href="/motions/${encodeURIComponent(e.motion || '')}/" data-slug="${esc(e.motion || '')}" data-id="${esc(e.id || '')}">`
          + `<time datetime="${esc(e.at)}">${esc(ago(e.at))}</time>${head}`
          + (e.kind === 'opened' || e.kind === 'deploy' ? '' : `<span class="txt">${esc(e.text)}</span>`) + '</a>';
      }).join('') || '<div class="ev">Nothing in the last day.</div>';
    } catch (e) {}
  }
  // --- open work: pull requests and new issues, with who asked, and where -------
  const workBox = document.getElementById('work');
  const workList = document.getElementById('workList');
  let workAt = 0;
  workBox.open = store.get('workOpen', false);
  workBox.addEventListener('toggle', () => { store.set('workOpen', workBox.open); if (workBox.open) refreshWork(true); });
  function workRow(i) {
    const who = i.asked_by ? `asked by <b>${esc(i.asked_by)}</b>` : (i.people.length ? esc(i.people.join(', ')) : esc(i.author));
    const where = i.moods.slice(0, 2).map(m => ` · <span class="mood" data-slug="${esc(m.slug)}" data-id="${esc(m.id)}">${esc(m.title)}</span>`).join('');
    const kind = i.kind === 'pr' ? (i.draft ? 'draft' : 'PR') : 'issue';
    return `<a class="ev" href="${esc(i.url)}" target="_blank" rel="noopener"><time datetime="${esc(i.updated_at)}">${esc(ago(i.updated_at))}</time>`
      + `<span class="repo">${esc(i.repo.split('/')[1])}#${i.number} · ${kind}</span>`
      + `<span class="txt">${esc(i.title)}</span>${who}${where}</a>`;
  }
  async function refreshWork(force) {
    if (!workBox.open || (!force && Date.now() - workAt < 300000)) return;
    workAt = Date.now();
    workList.innerHTML = workList.innerHTML || '<div class="ev">Asking…</div>';
    try {
      const d = await (await fetch('/api/work/')).json();
      if (d.error) { workList.innerHTML = `<div class="ev">${esc(d.error)}</div>`; return; }
      const fortnight = Date.now() - 14 * 86400 * 1000;
      const fresh = d.items.filter(i => new Date(i.updated_at) > fortnight);
      const older = d.items.filter(i => new Date(i.updated_at) <= fortnight);
      workList.innerHTML = (fresh.map(workRow).join('') || '<div class="ev">Nothing touched in two weeks.</div>')
        + (older.length ? `<details class="older"><summary>${older.length} quieter for two weeks or more</summary>${older.map(workRow).join('')}</details>` : '');
    } catch (e) { workList.innerHTML = '<div class="ev">Could not load open work.</div>'; }
  }
  workList.addEventListener('click', e => {
    const mood = e.target.closest('.mood');
    if (!mood) return;
    e.preventDefault();
    document.body.classList.remove('menu-open');
    openAndReveal(mood.dataset.slug, mood.dataset.id);
  });
  setInterval(() => refreshWork(false), 300000);

  recentList.addEventListener('click', e => {
    const a = e.target.closest('a.ev');
    if (!a || !a.dataset.slug) return;
    e.preventDefault();
    document.body.classList.remove('menu-open');
    openAndReveal(a.dataset.slug, a.dataset.id || null);
  });

  function touch(slug) {
    lastSeen[slug] = new Date().toISOString();
    store.set('lastSeen', lastSeen);
    if (unread[slug]) delete unread[slug];
    if (badges[slug]) { delete badges[slug]; renderNav(); setTitle(); }
  }
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && current) { touch(current); refreshBadges(true); }
  });

  // Bring a message into view, reaching back a few pages if need be.
  async function reveal(id) {
    if (!id) return false;
    for (let i = 0; i < 12; i++) {
      const el = document.getElementById('m-' + id);
      if (el) {
        const folded = el.closest('.aturn.folded');
        if (folded) { folded.classList.remove('folded'); drawBlockHead(folded); }
        el.scrollIntoView({ block: 'center' });
        el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
        return true;
      }
      const earlier = document.getElementById('earlier');
      if (!earlier || earlier.hidden) return false;
      await loadEarlier();
    }
    return false;
  }
  async function openAndReveal(slug, id) {
    if (slug !== current) await open(slug, true);
    await reveal(id);
  }
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.addEventListener('message', e => {
      if (e.data && e.data.open) openAndReveal(e.data.open, e.data.id);
    });
  }

  // What's been drawn for each Mood this visit: switching back puts it back at
  // once and asks only for what's new. The last few Moods are kept.
  const drawn = new Map();  // slug -> {nodes, lastId, firstId, headMotion, prev, scrollTop}
  const KEEP_DRAWN = 8;
  const FIRST_PAGE = 150;   // items on a first load; "Load earlier" for more
  let gen = 0;              // bumped at every switch: answers for a Mood since left are dropped

  function stash() {
    if (!current || !document.getElementById('turns')) return;
    const nodes = document.createDocumentFragment();
    while (inner.firstChild) nodes.appendChild(inner.firstChild);
    drawn.delete(current);
    drawn.set(current, { nodes, lastId, firstId, headMotion, prev, scrollTop: main.scrollTop });
    while (drawn.size > KEEP_DRAWN) drawn.delete(drawn.keys().next().value);
  }

  async function open(slug, push) {
    if (slug === current && document.getElementById('turns')) return;
    stash();
    gen++;
    current = slug;
    if (push) history.pushState({ slug }, '', '/motions/' + encodeURIComponent(slug) + '/');
    newBelow = 0;
    touch(slug);
    renderNav();
    // Nothing of the Mood just left may linger: not its agent's work, its
    // tasks, who was typing there, or its agents' settings.
    act = null; renderActivity();
    tasks = []; renderTasks();
    typingNow = []; renderTyping();
    renderAgents({});
    const saved = drawn.get(slug);
    if (saved) {
      drawn.delete(slug);
      inner.replaceChildren(saved.nodes);
      ({ lastId, firstId, prev } = saved);
      showMotionName(saved.headMotion);
      await poll(false);
    } else {
      lastId = null;
      inner.innerHTML = '<div class="empty">Loading…</div>';
      await poll(true);
    }
    // A Mood opens at its newest, always: what's for you is marked, and the @
    // arrows (or a notification, a search hit, a link) take you to it.
    toNewest();
    renderToBottom();
  }
  // To the newest, and stay there while images above it load and push it down.
  function toNewest() {
    main.scrollTop = main.scrollHeight;
    const until = Date.now() + 4000;
    document.querySelectorAll('#turns img').forEach(img => {
      if (!img.complete) img.addEventListener('load', () => { if (Date.now() < until) main.scrollTop = main.scrollHeight; }, { once: true });
    });
  }

  let firstId = null;      // the oldest item shown, for ?before=
  async function loadEarlier() {
    const button = document.getElementById('earlier');
    if (!firstId || !button) return;
    button.disabled = true; button.textContent = 'loading…';
    const mine = gen;
    try {
      const r = await fetch('/api/motions/' + encodeURIComponent(current) + '/turns/?before=' + firstId);
      const data = await r.json();
      if (mine !== gen) return;  // switched away meanwhile
      const items = itemsOf(data);
      const box = document.createElement('div');
      const saved = prev; prev = null;
      renderItems(items, box, false);
      foldOld(box, false);  // an earlier page: all of it is old
      prev = saved;
      const turnsEl = document.getElementById('turns');
      const height = main.scrollHeight;
      turnsEl.prepend(...box.children);
      main.scrollTop += main.scrollHeight - height;
      if (items.length) firstId = items[0].v.id;
      button.hidden = !data.has_earlier;
    } finally { button.disabled = false; button.textContent = 'Load earlier'; }
  }
  document.addEventListener('click', e => { if (e.target.id === 'earlier') loadEarlier(); });

  async function poll(full) {
    if (!current) return;
    const mine = gen;
    if (!full && pollingGen === mine) return;  // one poll at a time per Mood: two could draw the same items twice
    pollingGen = mine;
    try { await pollOnce(full, mine); } finally { if (pollingGen === mine) pollingGen = null; }
  }
  let pollingGen = null;
  async function pollOnce(full, mine) {
    const url = '/api/motions/' + encodeURIComponent(current) + '/turns/'
      + (lastId && !full ? '?after=' + lastId : '?limit=' + FIRST_PAGE);
    let data;
    try {
      const r = await fetch(url);
      if (!r.ok) throw new Error(r.status);
      data = await r.json();
      setStatus('live', 'live');
    } catch (e) {
      if (mine === gen) setStatus('reconnecting…', 'stale');
      return;
    }
    if (mine !== gen) return;  // an answer for a Mood since left: drawing it here would mislead
    if (full) {
      prev = null;
      inner.innerHTML = renderHead(data.motion);
      showMotionName(data.motion);
    } else if (headMotion && data.motion && data.motion.title !== headMotion.title) {
      // Someone renamed it: say so in place, without redrawing the thread.
      showMotionName(data.motion);
      loadMotions();
    }
    act = data.activity || null;
    renderActivity();
    tasks = data.tasks || [];
    renderTasks();
    renderAgents(data.agents || {});
    renderLocked(data.scram || null);
    typingNow = (data.typing || []).filter(n => n !== viewer);
    renderTyping();
    const turnsEl = document.getElementById('turns');
    if (!turnsEl) return;
    const items = itemsOf(data);
    if (full) {
      firstId = items.length ? items[0].v.id : null;
      const earlier = document.getElementById('earlier');
      earlier.hidden = !data.has_earlier;
      if (!items.length) turnsEl.innerHTML = '<div class="empty">Nothing said here yet.</div>';
    }
    if (items.length) {
      const nearBottom = main.scrollHeight - main.scrollTop - main.clientHeight < 120;
      const emptyNote = turnsEl.querySelector('.empty'); if (emptyNote) emptyNote.remove();
      renderItems(items, turnsEl, !full);
      if (full) foldOld(turnsEl);
      lastId = items[items.length - 1].v.id;
      if (full || nearBottom) main.scrollTop = main.scrollHeight;
      else if (!full) { newBelow += data.turns.length; }
      renderToBottom();
      // Seen only if someone's looking: an answer that lands while this page is
      // hidden is still news, and is told as a notice.
      if (!document.hidden) touch(current);
      if (!full && data.turns.length) { await loadMotions(); }
    }
    // An agent just finished here: ask now, not in 15 s, whether it answered me.
    const finished = wasBusy && !act;
    wasBusy = !!act;
    await refreshBadges(finished);
    refreshRecent(false);
  }
  let wasBusy = false;

  // --- back to the newest -----------------------------------------------------
  const toBottom = document.getElementById('toBottom');
  let newBelow = 0;  // turns that arrived while scrolled up
  function renderToBottom() {
    const far = main.scrollHeight - main.scrollTop - main.clientHeight > 400;
    if (!far) newBelow = 0;
    toBottom.classList.toggle('on', far);
    toBottom.textContent = newBelow ? `↓ ${newBelow} new` : '↓ newest';
  }
  main.addEventListener('scroll', renderToBottom, { passive: true });
  toBottom.addEventListener('click', () => main.scrollTo({ top: main.scrollHeight, behavior: 'smooth' }));

  // --- what an agent is doing: read from the record, ticking locally ----------
  const activityEl = document.getElementById('activity');
  const activityText = document.getElementById('activityText');
  function elapsed(since) {
    const s = Math.max(0, Math.floor(Date.now() / 1000 - since));
    if (s < 60) return s + 's';
    if (s < 3600) return Math.floor(s / 60) + 'm ' + String(s % 60).padStart(2, '0') + 's';
    return Math.floor(s / 3600) + 'h ' + String(Math.floor(s % 3600 / 60)).padStart(2, '0') + 'm';
  }
  // --- listening: hush an agent here, for a while or until changed ----------
  const HUSH = [['on', 0, 'listening'], ['mentions', 60, 'mentions only · 1 hour'],
                ['mentions', 0, 'mentions only · until changed'], ['off', 60, 'hushed · 1 hour'],
                ['off', 120, 'hushed · 2 hours'], ['off', 0, 'hushed · until changed']];
  // Model and effort for this agent's mention wakes here (settings: model,
  // mention_effort), so changing them needs no trip to the settings page.
  const MODELS = [['', 'default model'], ['opus', 'opus'], ['sonnet', 'sonnet'], ['fable', 'fable'], ['haiku', 'haiku']];
  const EFFORTS = ['low', 'medium', 'high', 'xhigh', 'max'];
  const EFFORT_LABELS = { xhigh: 'extra' };  // as the terminal names them
  const READS = [2500, 5000, 10000, 20000];  // tokens a wake reads word for word (catch_up_tokens)
  let agentsNow = {}, agentsShown = '';
  function describeListening(l) {
    const until = l.until ? ' until ' + new Date(l.until).toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' }) : '';
    return l.mode === 'on' ? 'listening' : (l.mode === 'mentions' ? 'mentions only' : 'hushed') + until;
  }
  function shortModel(m) { return (m || '').replace(/^claude-/, '').replace(/-(\d+)-(\d+)$/, ' $1.$2'); }
  // A pie for how full `name`'s context is here, or nothing if unknown.
  function pieAttrs(name) {
    const c = (agentsNow[name] || {}).context;
    if (!c || !c.window) return null;
    const pct = Math.min(100, Math.round(100 * c.tokens / c.window));
    const title = c.compacted
      ? `compacted ${stamp(c.at)} · about ${c.tokens.toLocaleString()} tokens of ${c.window.toLocaleString()}, the summary; its next turn measures it`
      : `context ${pct}% full · ${c.tokens.toLocaleString()} of ${c.window.toLocaleString()} tokens`
        + (c.model ? ` · ${shortModel(c.model)}` : '') + ` · as of ${stamp(c.at)}`;
    return { pct, title };
  }
  // Wherever an agent is named with its settings -- the people chips, the
  // agent rows -- its pie leads; drawn in place, since the rest changes rarely.
  function refreshPies() {
    // ⚙ on a phone carries the pie of whichever agent here is fullest.
    const fullest = Object.keys(agentsNow).sort((a, b) => ((pieAttrs(b) || {}).pct || 0) - ((pieAttrs(a) || {}).pct || 0))[0];
    const gear = document.getElementById('agentsBtn');
    if (fullest) gear.dataset.who = fullest; else delete gear.dataset.who;
    document.querySelectorAll('.people .who.agent, #hush .agent, #agentsBtn').forEach(el => {
      const a = pieAttrs(el.dataset.who);
      let p = el.querySelector('.pie');
      if (!a) { if (p) p.remove(); return; }
      if (!p) { p = document.createElement('span'); el.prepend(p); }
      p.className = 'pie' + (a.pct > 90 ? ' full' : a.pct > 80 ? ' hot' : a.pct > 70 ? ' warm' : '');
      p.style.setProperty('--p', a.pct + '%');
      p.title = a.title;
    });
  }
  function renderAgents(agents) {
    agentsNow = agents;
    const box = document.getElementById('hush');
    // Redraw the menus only when a setting changed: never under someone's open menu.
    const key = JSON.stringify(Object.entries(agents).map(([n, a]) => [n, a.listening, a.model, a.effort, a.ultracode, a.reads, viewer]));
    if (box && (key !== agentsShown || !box.childElementCount)) {
      agentsShown = key;

    }
    refreshPies();
  }
  function agentRows(agents) {
    return Object.entries(agents).map(([agent, a]) => {
      const l = a.listening, ctx = a.context || {};
      const row = `<span class="agent${l.mode === 'on' ? '' : ' off'}" data-who="${esc(agent)}">${icon(agent, false)}${esc(agent)}: `;
      if (!viewer) {
        return row
          + `${esc(describeListening(l))} · ${esc(a.model || 'default model')} · effort ${esc(EFFORT_LABELS[a.effort] || a.effort)} · reads ${esc(kTokens(a.reads || 10000))}`
          + (a.ultracode ? ' · ultracode' : '') + '</span>';
      }
      const listen = `<select data-agent="${esc(agent)}" data-knob="listening"><option selected disabled>${esc(describeListening(l))}</option>`
        + HUSH.map(([mode, minutes, label], i) => `<option value="${i}">${esc(label)}</option>`).join('') + '</select>';
      const models = MODELS.some(([v]) => v === a.model) ? MODELS : [...MODELS, [a.model, a.model]];
      const model = `<select data-agent="${esc(agent)}" data-knob="model" title="model for its wakes here">`
        + models.map(([v, label]) => `<option value="${esc(v)}"${v === a.model ? ' selected' : ''}>`
          + `${esc(v ? label : (ctx.model ? `default (${shortModel(ctx.model)})` : label))}</option>`).join('') + '</select>';
      const effort = `<select data-agent="${esc(agent)}" data-knob="mention_effort" title="how hard it thinks when @mentioned here">`
        + EFFORTS.map(v => `<option value="${v}"${v === a.effort ? ' selected' : ''}>effort ${EFFORT_LABELS[v] || v}</option>`).join('') + '</select>';
      // How much of what was said since its last word a wake reads word for word.
      const reads = `<select data-agent="${esc(agent)}" data-knob="catch_up_tokens" title="How much of what was said here since it last spoke a wake reads word for word; older is summarized">`
        + READS.map(n => `<option value="${n}"${n === a.reads ? ' selected' : ''}>reads ${kTokens(n)}</option>`).join('')
        + (READS.includes(a.reads) ? '' : `<option value="${a.reads}" selected>reads ${kTokens(a.reads)}</option>`) + '</select>';
      const ultra = `<label class="ultra" title="Claude Code's standing multi-agent workflows, on wakes with full tools: thorough, and costly">`
        + `<input type="checkbox" data-agent="${esc(agent)}" data-knob="ultracode"${a.ultracode ? ' checked' : ''}> ultracode</label>`;
      return `${row}${listen} ${model} ${effort} ${reads} ${ultra}</span>`;
    }).join('');
  }
  document.addEventListener('change', async e => {

  // What an agent left running in the background, as in its terminal.

  // Stop what the agent here is doing: a turn under way ends within seconds,

  const stopBtn = document.getElementById('stopBtn');
  async function interrupt() {
    if (!act || act.doing === 'held' || !viewer || !current) return false;

      const r = await fetch('/api/motions/' + encodeURIComponent(current) + '/interrupt/', {
        method: 'POST', headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrf() },
        body: JSON.stringify({ agent: act.agent }),
      });
      if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.status);
      act = null; renderActivity();
      await poll(false);
    } catch (e) { showError('stop: ' + e.message); }

    return true;
  }
  stopBtn.addEventListener('click', interrupt);

    document.querySelectorAll('.people .who').forEach(el => el.classList.toggle('busy', !!act && act.doing !== 'held' && el.dataset.who === act.agent));

    activityText.innerHTML = act.doing === 'waking'
      ? `waking ${icon(act.agent, false)}<b>${esc(act.agent)}</b> · ${elapsed(act.since)}`
      : act.doing === 'held'
      ? `${icon(act.agent, false)}<b>${esc(act.agent)}</b> · held: ${esc(act.why || 'not yet')}`
        + (act.until ? ` · answers about ${esc(hhmm(act.until))}` : '') + ` · asked ${elapsed(act.since)} ago`
      : `${icon(act.agent, false)}<b>${esc(act.agent)}</b> · ${esc(act.doing)} · ${elapsed(act.since)}`
        + ([act.model, act.effort].filter(Boolean).length ? ` · ${esc([act.model, act.effort].filter(Boolean).join(' · '))}` : '');
  }
  setInterval(renderActivity, 1000);

  // --- @-completion: people in this Motion first, then everyone else -------

  let choices = [], chosen = 0;
  // Emoji by name, as `:name` -- a small set, favourites first.

    ['pizza', '🍕'], ['taco', '🌮'], ['apple', '🍎'], ['peach', '🍑'], ['dog', '🐶'], ['cat', '🐱'],

  // [[ suggests PickiPedia titles, as the wiki's own editor does (LinkSuggest).
  // Its API answers any origin, so the browser asks the wiki directly.
  const WIKI = "{{ pickipedia_url|escapejs }}" || 'https://pickipedia.xyz';
  const wikiCache = new Map();
  let wikiTimer = null;
  function titleCase(s) { return s.replace(/(^|[\s:_(-])([a-z])/g, (m, p, c) => p + c.toUpperCase()); }
  async function wikiTitles(prefix) {
    if (wikiCache.has(prefix)) return wikiCache.get(prefix);
    const ask = async q => {
      const r = await fetch(`${WIKI}/api.php?action=query&list=prefixsearch&pslimit=8&format=json&origin=*&pssearch=${encodeURIComponent(q)}`);
      return ((await r.json()).query || {}).prefixsearch || [];
    };
    let hits = [];
    try {
      hits = await ask(prefix);
      // Titles are case-sensitive after the first letter: 'tony r' finds
      // nothing, 'Tony R' finds Tony Rice.
      if (!hits.length && titleCase(prefix) !== prefix) hits = await ask(titleCase(prefix));
    } catch (e) { hits = []; }
    const titles = hits.map(h => h.title);
    wikiCache.set(prefix, titles);
    return titles;
  }

  function wordAtCaret() {
    const upto = sayBox.value.slice(0, sayBox.selectionStart);
    const w = upto.match(/\[\[([^\[\]|\n]{1,100})$/);
    if (w) return { kind: 'wiki', start: upto.length - w[1].length, prefix: w[1] };
    let m = upto.match(/(^|[^\w@\/.])@([A-Za-z][\w.-]*)?$/);
    if (m) return { kind: 'mention', start: upto.length - (m[2] || '').length, prefix: (m[2] || '').toLowerCase() };
    // `:` starting a word -- so 10:30 doesn't open it.
    m = upto.match(/(^|[\s(]):([a-z0-9_+-]{0,30})$/);
    if (m) return { kind: 'emoji', start: upto.length - m[2].length - 1, prefix: m[2] };
    return null;
  }
  function closeSuggest() { suggest.classList.remove('on'); choices = []; }
  function showSuggest() {
    const at = wordAtCaret();
    if (!at) return closeSuggest();
    if (at.kind === 'wiki') {
      clearTimeout(wikiTimer);
      const prefix = at.prefix;
      wikiTimer = setTimeout(async () => {
        const titles = await wikiTitles(prefix);
        const still = wordAtCaret();
        if (!still || still.kind !== 'wiki' || still.prefix !== prefix) return;  // they've typed on
        choices = titles.map(t => ({ insert: t + ']]', html: `<span class="emo">📖</span>${esc(t)}` }));
        if (!choices.length) return closeSuggest();
        chosen = Math.min(chosen, choices.length - 1);
        suggest.innerHTML = choices.map((c, i) => `<div class="${i === chosen ? 'sel' : ''}" data-i="${i}">${c.html}</div>`).join('');
        suggest.classList.add('on');

      return;

        .map(n => ({ insert: n + ' ', html: `${icon(n)}@${esc(n)}<small>${human[n] ? 'person' : 'agent'}${here.has(n) ? '' : ' · not here yet'}</small>` }));

  // Images into the composer: paste, drop, or the + button. Each is stored

  function showError(message) {

  async function upload(file) {
    const marker = `![uploading ${file.name || 'image'}…]()`;

      const r = await fetch('/api/motions/' + encodeURIComponent(current) + '/media/', {

      sayBox.value = sayBox.value.replace(marker, body.markdown);

    sayBox.dispatchEvent(new Event('input'));
  }
  function insertAtCaret(text) {

    document.getElementById('signout').addEventListener('click', async e => {
      e.preventDefault();
      await fetch('/api/auth/logout/', { method: 'POST', headers: { 'X-CSRFToken': csrf() } });
      location.reload();
    });
  } else {
    userBtn.textContent = 'read-only ▾';
    auth.innerHTML = 'To write, run <code>magenta.sh login</code> on a machine with your SSH key.';
  }
  // Your devices: when each signed in, last wrote, and times out; revoke any.
  const devicesBox = document.getElementById('devicesBox');
  async function showDevices() {
    userMenu.hidden = true;
    devicesBox.hidden = false;
    const list = document.getElementById('devicesList');
    list.textContent = 'Loading…';
    const r = await fetch('/api/auth/devices/');
    if (!r.ok) { list.textContent = 'Could not load your devices.'; return; }
    const d = await r.json();
    list.innerHTML = `<div class="meta">A device unused for ${d.idle_days} days times out; bring it back with `
      + `<code>magenta.sh renew &lt;its name&gt;</code>.</div>` + d.devices.map(v => {
        const state = v.state === 'live' ? (v.this ? 'this device' : 'signed in')
          : v.state === 'timed out' ? 'timed out' : 'revoked';
        const out = v.times_out_at ? ` · times out ${esc(new Date(v.times_out_at).toLocaleDateString())}` : '';
        return `<div class="dev ${v.state === 'revoked' ? 'revoked' : v.state === 'timed out' ? 'timed' : ''}">`
          + `<b>${esc(v.label)}</b> · ${esc(state)}`
          + (v.state !== 'revoked' ? ` <button type="button" data-revoke="${esc(v.id)}" data-this="${v.this ? 1 : ''}">revoke</button>` : '')
          + `<div class="meta">signed in ${esc(ago(v.signed_in_at))} · last used ${esc(ago(v.last_used_at))}${out}`
          + (v.state === 'timed out' ? ` · <code>magenta.sh renew ${esc(v.label)}</code>` : '') + '</div></div>';
      }).join('');
  }
  document.getElementById('devicesLink').addEventListener('click', e => { e.preventDefault(); showDevices(); });
  document.getElementById('devicesClose').addEventListener('click', () => { devicesBox.hidden = true; });
  devicesBox.addEventListener('click', async e => {
    const b = e.target.closest('[data-revoke]');
    if (!b) return;
    if (!confirm(b.dataset.this ? 'Sign this device out?' : 'Sign that device out, for good?')) return;
    const r = await fetch(`/api/auth/devices/${b.dataset.revoke}/revoke/`, { method: 'POST', headers: { 'X-CSRFToken': csrf() } });
    if (r.ok && b.dataset.this) { location.reload(); return; }
    showDevices();
  });

  userBtn.addEventListener('click', e => {
    e.stopPropagation();
    userMenu.hidden = !userMenu.hidden;
    userBtn.setAttribute('aria-expanded', !userMenu.hidden);
  });
  document.addEventListener('click', e => {
    if (!userMenu.hidden && !e.target.closest('.account')) { userMenu.hidden = true; userBtn.setAttribute('aria-expanded', false); }
  });

  async function say() {
    const text = sayBox.value.trim();
    if (!text || !current) return;
    sendBtn.disabled = true;
    const old = composer.querySelector('.err'); if (old) old.remove();
    try {
      const r = await fetch('/api/motions/' + encodeURIComponent(current) + '/say/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrf() },
        body: JSON.stringify({ text }),
      });
      if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.status);
      sayBox.value = ''; fitSay(); typingSent = 0; sendTyping(false);
      await poll(false);
    } catch (e) {
      composer.insertAdjacentHTML('beforeend', `<span class="err">${esc(e.message)}</span>`);
    } finally {
      sendBtn.disabled = false;
      sayBox.focus();
    }
  }
  composer.addEventListener('submit', e => { e.preventDefault(); say(); });
  // Enter sends; Ctrl+Enter (or Shift+Enter) makes a new line. On a touch
  // screen there is no Ctrl, so Enter makes the new line and Send sends.
  const touchScreen = matchMedia('(pointer: coarse)').matches;
  sayBox.addEventListener('keydown', e => {
    if (e.key !== 'Enter' || e.isComposing || e.keyCode === 229) return;  // mid-composition (IME)
    if (e.ctrlKey || e.metaKey) {
      e.preventDefault(); insertAtCaret('\n'); sayBox.dispatchEvent(new Event('input')); return;
    }
    if (e.shiftKey || e.altKey || touchScreen) return;  // the textarea's own new line
    e.preventDefault(); say();
  });

  nav.addEventListener('click', e => {
    const a = e.target.closest('a.motion'); if (!a) return;
    e.preventDefault(); open(a.dataset.slug, true);
  });
  window.addEventListener('popstate', e => {
    const slug = (e.state && e.state.slug) || location.pathname.split('/')[2];
    if (slug) open(decodeURIComponent(slug), false);
  });

  (async function start() {
    try { await loadMotions(); } catch (e) { setStatus('cannot reach memory-lane', 'stale'); return; }
    const slug = initialSlug || (motions[0] && motions[0].slug);
    if (!slug) { inner.innerHTML = '<div class="empty">No Moods yet.</div>'; setStatus('live', 'live'); return; }
    await open(slug, false);
    const linked = location.hash.match(/^#m-([0-9a-f-]{36})$/);  // from a notification
    if (linked) await reveal(linked[1]);
    setInterval(() => poll(false), POLL_MS);
  })();
  // Installable as an app: the browser wants a service worker (it keeps nothing).
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/motions/sw.js', { scope: '/motions/' }).catch(() => {});
})();
</script>
</body>
</html>
